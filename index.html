${P("5M ATR 16 -> buffer 0.4 x 16 = 6\nStop   = 30,188 - 6 = 30,182\nEntry  = 30,218\nRisk   = 36 points = $72 per MNQ contract\n\nFirst obstacle above: PDC 30,318\nTarget = 30,312 (just under it)\nReward = 94 points  ->  RR = 94 / 36 = 2.6R  (passes)\n\nRisk budget $250 / $72 = 3.47 -> 3 contracts\nActual risk $216, potential reward $564")}
<h2>8:16 AM: execution</h2>
<p>Bracket order: buy 3 MNQ at market, stop 30,182, limit 30,312. Fill at 30,218.75 (one tick slippage). Set a TradingView alert at 30,312. Close the 5M chart and do something else.</p>
<h2>9:02 AM: result</h2>
<p>Target fills. +93.25 points x 3 x $2 = <strong>+$559.50, about +2.6R</strong>. Log it, screenshot it, done trading for the morning unless a second A+ setup appears.</p>`},

{id:"s3b",t:"Walkthrough: a correct loss",h:`
<h1>Walkthrough: a correct loss</h1>
<p class="lede">You will lose more than half your trades. Here is what a loss looks like when you do everything right, and why it is still a good trade.</p>
<h2>Setup</h2>
${P("1H price above rising 20 EMA  -> longs allowed\nZone S2  30,110-30,135   score 7   (3 touches, round # 30,100 nearby)\n\n8:32 AM  price drops into S2, RSI(5M) prints 34\n8:40 AM  bullish engulfing closes at 30,128, low 30,110\n         volume above prior 3 candles   confluence score 7 (B)")}
<h2>The math</h2>
${P("5M ATR 15 -> buffer 6\nStop   = 30,110 - 6 = 30,104\nEntry  = 30,128   risk 24 pts = $48 per MNQ\nFirst obstacle: broken level 30,190 -> target 30,184\nReward 56 pts -> 2.33R  (passes)\nSize   = $200 / $48 = 4 contracts   actual risk $192")}
<h2>What happened</h2>
<p>Price rallies to 30,150, which is +0.9R. Then it stalls, rolls over, and slices back through the zone. Stop fills at 30,103.75 with one tick of slippage. Result: -24.25 pts x 4 x $2 = <strong>-$194, about -1.01R</strong>.</p>
<h2>The moment that matters</h2>
<p>At +0.9R you will feel a strong urge to close and "lock in" a small win. If you had closed there, this particular trade would have looked smarter. But that habit, repeated across 100 trades, is exactly what turns a 2.3R plan into a 1.8R result. You left the bracket alone. That was correct.</p>
<h2>After the trade</h2>
<ul>
<li>Zone S2 is now dead for the day. No re-entry, even if price comes back</li>
<li>One loss today. One more trade allowed, and only from a different zone</li>
<li>Journal: followed plan = <strong>Yes</strong>. Mistake cost = <strong>0R</strong></li>
</ul>
${B("good","Grade: A","<p>Every rule followed. The loss is the cost of doing business. At a 43% win rate, a string of trades exactly like this one is normal and expected.</p>")}`},

{id:"s3c",t:"Walkthrough: correct skips",h:`
<h1>Walkthrough: correct skips</h1>
<p class="lede">Skipping is a skill. Here are four setups that looked tempting and why each one was correctly passed on, including one that would have won.</p>
${T(["#","What you saw","Why you skipped","What happened"],[
["1","Price tagged S1 and printed a nice hammer","RSI only reached 44. Condition 3 not met","Bounced 1R, then failed. Would have lost"],
["2","Perfect engulfing at S1 at 6:36 AM MT","6:30 CPI release. Inside the 15-minute blackout","Whipsawed 60 points both ways. Would have stopped out"],
["3","All four conditions, score 7","ONL overhead only 1.4R away. Failed the 2R rule","Hit 1.4R and reversed. Would have been a small win at best, a loss at target"],
["4","All four conditions, score 5","Score under 6. C setup","Went straight to 3R. Would have won"]],[0])}
<h2>About skip #4</h2>
<p>Some skipped setups will win. That is fine and expected. The question is never whether one skip was right. It is whether skipping C setups as a group improves your results. Log every skip with its would-be outcome, and after 50 of them your data will answer the question for you.</p>
${B("note","How to log skips","<p>Use a separate Skipped tab in your journal with the same columns. Fill in the result you would have gotten. Keep them out of your real stats.</p>")}
${B("good","The mindset","<p>You get paid for waiting as much as for acting. A day with zero trades and a clean plan is a successful day.</p>")}`},


{id:"s4",t:"Entry execution details",h:`
<h1>Entry execution details</h1>
<p class="lede">The small mechanical choices that decide whether your real RR matches your planned RR.</p>
<h2>Market at the close</h2>
<p>When the reversal candle closes, enter with a market order immediately. On MNQ during the morning, expect 0 to 1 tick of slippage.</p>
<h2>The chase rule</h2>
<p>If you missed the close and price has already run more than 0.3R above the close, skip the trade. Chasing makes your stop larger or your RR smaller, and both break the math.</p>
<h2>Order checklist, every time</h2>
<ul class="checklist">
<li><input type="checkbox" id="ex1"><label for="ex1">Correct contract month selected</label></li>
<li><input type="checkbox" id="ex2"><label for="ex2">Quantity matches calculator output</label></li>
<li><input type="checkbox" id="ex3"><label for="ex3">Bracket on: stop and target both attached</label></li>
<li><input type="checkbox" id="ex4"><label for="ex4">Stop is below entry, target above (long)</label></li>
<li><input type="checkbox" id="ex5"><label for="ex5">Alert set at target, chart closed or minimized</label></li>
</ul>
<h2>In FX Replay</h2>
<p>Open the order panel, choose Market, type the lot size you calculated (never the preset buttons), enable Stop Loss and Take Profit, and enter the exact prices from your plan before submitting.</p>`},

{id:"s5",t:"Stop placement",h:`
<h1>Stop placement</h1>
<p class="lede">Your stop goes where the trade idea is proven wrong, plus a small buffer. Never where it feels comfortable.</p>
<h2>The method</h2>
${P("Stop = min(zone low, trigger candle low) - buffer\n\nBuffer:\n  MNQ / MES  0.3 to 0.5 x 5M ATR(14)\n  EUR/USD    2 to 4 pips (or 0.4 x 5M ATR)\n  AAPL       0.3 to 0.5 x 5M ATR, usually $0.05 to $0.20")}
${FIG_STOP}
<h2>When the stop is too wide</h2>
<p>If the correct stop is unusually far, your position size shrinks automatically. That is fine. But if the stop is more than about 2x your typical stop, the zone is probably too tall or the market too wild. Skip it.</p>
${B("warn","Never do these","<ul><li>Move your stop further away once in a trade</li><li>Place the stop at a round number because it looks neat</li><li>Place the stop exactly at the zone low with no buffer</li><li>Tighten the stop just to fit more contracts</li></ul>")}
<h2>Why this matters for your RR</h2>
<p>Stops set wider than structure requires are one of the three causes of low RR. Measure your stop distance in ATR units in your journal. If you are routinely above 1 ATR of buffer, you are giving away reward.</p>`},

{id:"s6",t:"Target selection",h:`
<h1>Target selection</h1>
<p class="lede">The target is the first place sellers are likely to show up. You exit just before them.</p>
<h2>List of obstacles, check all</h2>
<ul>
<li>Previous day close and high (PDC, PDH)</li>
<li>Overnight high (ONH)</li>
<li>1H resistance zones and recent 1H swing highs</li>
<li>Broken support levels above (now resistance)</li>
<li>Round numbers (every 100 on MNQ)</li>
<li>VWAP, if price is below it</li>
</ul>
<h2>The front-run rule</h2>
<p>Place your target a few ticks <strong>before</strong> the obstacle: 4 to 8 points on MNQ, 2 to 3 pips on EUR/USD. Other traders exit right at the level, so price often turns just short of it.</p>
<h2>Measuring it on TradingView</h2>
<p>Use the <strong>Long Position</strong> tool (left toolbar, prediction and measurement group). Click your entry, drag the red box to your stop and the green box to your target. It shows RR instantly. Under 2.0 means no trade.</p>
${B("good","When there is lots of room","<p>If the first obstacle is 4R or more away, still take a 3R target as your baseline. Test running to 4R+ later as a separate variation.</p>")}`},

{id:"s7",t:"Trade management",h:`
<h1>Trade management</h1>
<p class="lede">Your baseline is simple: set the bracket and leave it alone. Every other management rule must earn its place with data.</p>
<h2>Baseline: set and forget</h2>
<p>Stop and target placed at entry. You do not touch either. This is the only way your actual RR will match your planned RR, and it is the fix for your 1.80 RR if early exits are the cause.</p>
<h2>Management variations to test later (one at a time)</h2>
${T(["Variation","How it works","Tradeoff"],[
["Breakeven at 1.5R","Move stop to entry once price reaches 1.5R","Fewer full losses, but some winners get stopped at zero before running"],
["Partial at 1.5R","Close half at 1.5R, leave half to target","Smoother equity, lower average R"],
["Time stop","Exit if price has not moved 1R in your favor within 60 minutes","Frees you from dead trades, may cut some late winners"],
["Trail below 5M swing lows","After 2R, move stop under each new higher low","Captures trend days, gives back more on normal days"]])}
${B("warn","The one rule with no exceptions","<p>A stop can move toward profit. It can never move further away from entry. Not once.</p>")}`},

{id:"s8",t:"Grading your setups",h:`
<h1>Grading your setups</h1>
<p class="lede">Every valid setup gets a grade before you enter. Grades come from the confluence score in Module 6.</p>
${T(["Grade","Score","Typical features","Action"],[
["A+","8 to 10","3+ touch zone overlapping a daily level, RSI under 35, sweep and reclaim, strong volume, 3R room","Take it every time"],
["B","6 to 7","2 touch zone, RSI 35 to 40, clean candle, 2 to 2.5R room","Take it"],
["C","under 6","Rules technically met, but thin zone, weak candle, low volume, or choppy tape","Skip and log it as skipped"]])}
<p>Logging skipped C setups is important. After 50 or so you will be able to check whether skipping them was right. It almost always is.</p>`},

{id:"s9",t:"When it goes wrong",h:`
<h1>When it goes wrong</h1>
<p class="lede">Every one of these will happen. Decide your response now, not in the moment.</p>
${T(["Situation","Response"],[
["Price slices through the zone with no reversal candle","No trade. Nothing was triggered. Mark the zone broken"],
["Entered, immediate reversal to stop","Take the loss. Normal. Do not re-enter the same zone"],
["Stopped out, then price goes to target","Note it. If it happens more than 2 times in 20 trades, check your buffer size"],
["In profit but stalling below target","Leave it. The bracket decides"],
["Forgot to attach the stop","Attach it immediately at the planned price, or close the trade. Never trade without one"],
["Platform freezes","Call your broker or prop firm's trade desk. Save their number now"],
["Big news headline hits while in a trade","Your stop protects you. Do not panic-close unless your plan says to"],
["Setup at 1:45 PM MT","Skip. Past your cutoff"],
["Price never comes near your zones all morning","No trade. Do not draw new zones to create one"],
["You spot a great level you did not mark","Not in the plan, so no trade. Add it to tomorrow's prep if it scores well"],
["Two losses already today","Done for the day. Close the platform"]])}
${FIG_BREAK}`},

{id:"s10",t:"The short side (later)",h:`
<h1>The short side (later)</h1>
<p class="lede">The mirror image. Add it only after 100+ profitable trades on the long side.</p>
${T(["Long version","Short version"],[
["1H price above rising 20 EMA","1H price below falling 20 EMA"],
["Pullback into support zone","Rally into resistance zone"],
["5M RSI below 40","5M RSI above 60"],
["Bullish reversal candle","Bearish reversal candle (shooting star, bearish engulfing)"],
["Stop below zone minus buffer","Stop above zone plus buffer"],
["Target next resistance above","Target next support below"]])}
${B("warn","Why wait","<p>Two directions doubles your decisions and splits your data in half. Your stats become harder to read and improve.</p>")}`},

{id:"s11",t:"Variations worth testing",h:`
<h1>Variations worth testing</h1>
<p class="lede">Only after 100 baseline trades. One change at a time, 50+ trades each, compared against the baseline.</p>
${T(["Variation","Question it answers"],[
["Morning only (7:45 to 9:00 AM MT)","Is my edge concentrated at the open?"],
["RSI under 35 instead of 40","Does stricter exhaustion raise win rate enough to offset fewer trades?"],
["Require VWAP confluence","Does VWAP improve results for me?"],
["Require 4H zone overlap","Do higher-timeframe zones outperform?"],
["3R fixed target","Does holding longer increase expectancy?"],
["Breakeven at 1.5R","Does protecting profit help or hurt overall?"]])}
<p>Record each test in its own tab of your journal spreadsheet with its own stats.</p>`},

{id:"s12",t:"Your written rulebook",h:`
<h1>Your written rulebook</h1>
<p class="lede">Copy this by hand into the front page of your trading notebook. Read it every morning.</p>
${P("1H SUPPORT PULLBACK LONG\n\nFILTER\n  [ ] 1H price above rising 1H 20 EMA\n  [ ] No red news in next 30 min\n  [ ] Not chop (Module 3 test)\n\nTRIGGER (all)\n  [ ] Price in pre-marked 1H zone (2+ touches)\n  [ ] 5M RSI(14) dipped below 40 in zone\n  [ ] 5M reversal candle CLOSED at/above zone mid\n  [ ] First obstacle 2R+ away\n  [ ] Confluence score 6+\n\nEXECUTE\n  Entry  market at close (skip if >0.3R chase)\n  Stop   min(zone low, candle low) - 0.4 ATR\n  Target a few ticks before first obstacle\n  Size   (acct x 0.5%) / (stop pts x $/pt), round down\n  Bracket order, then walk away\n\nLIMITS\n  1 attempt per zone, 2 trades/day, stop after 2 losses\n  No entries after 1:30 PM MT")}`},

{id:"sq",t:"Check yourself: The strategy",q:[
{q:"Entry 30,218, stop 30,182, first obstacle at 30,270. Take the trade?",o:["Yes","No, only about 1.4R of room","Yes with bigger size","Only on 1M"],a:1,e:"52 / 36 = 1.44R. Fails the 2R rule."},
{q:"You missed the close and price is already 0.5R above it. What now?",o:["Buy at market","Buy with a wider stop","Skip it","Buy with a limit at the close"],a:2,e:"Beyond 0.3R past the close, skip. Chasing breaks your RR."},
{q:"Zone low 30,190, trigger candle low 30,186, ATR 20. Where is the stop?",o:["30,190","30,186","About 30,178","30,150"],a:2,e:"30,186 minus 0.4 x 20 (8) = 30,178."},
{q:"A 5M candle closes below your zone. You:",o:["Buy the dip","Wait for RSI under 30","Consider the zone dead for today","Move the zone lower"],a:2,e:"A close below the zone is acceptance below support."},
{q:"You already lost twice today and see an A+ setup. You:",o:["Take it at half size","Take it, it is A+","Skip it, you are done for the day","Take it at double size to recover"],a:2,e:"Daily stop after 2 losses has no exceptions."},
{q:"You are at +0.9R on a 2.3R plan and price stalls. You:",o:["Close to lock in profit","Move the stop to breakeven","Leave the bracket alone","Add contracts"],a:2,e:"Closing early is how a 2.3R plan becomes a 1.8R result over many trades."}
]}
]});
MODULES.push({title:"Raising your win rate",lessons:[
{id:"w1",t:"Win rate the right way",h:`
<h1>Win rate the right way</h1>
<p class="lede">You want the highest win rate possible. The way to get it without wrecking your profits is to stop taking the trades most likely to lose.</p>
<p>Every trade you take belongs to one of two groups: trades that fit your best conditions, and trades that technically qualify but come from weaker conditions. Your overall win rate is a blend of both. Remove the weaker group and your win rate rises while your RR stays the same.</p>
${P("Example, 100 trades:\n  60 high-quality  -> 52% win rate at 2.2R\n  40 low-quality   -> 30% win rate at 1.9R\n  Blended          -> about 43%\n\nCut the 40 low-quality:\n  60 trades at 52% and 2.2R\n  Expectancy rises from about +0.35R to about +0.66R per trade")}
<p>This module gives you the tools to find and remove that weaker group: a confluence score, specific filters, time-of-day rules, no-trade days, and a way to prove it all with your own data.</p>
${B("note","Realistic ceiling","<p>For a pullback strategy like this, 45 to 55% at 2R or better is a strong, realistic target after filtering. Claims of 80 to 90% win rates with good RR almost always come from cherry-picked examples or tiny samples.</p>")}`},

{id:"w2",t:"The confluence score",h:`
<h1>The confluence score</h1>
<p class="lede">A 10-point checklist you run on every valid setup. It turns "this feels good" into a number. Use the live scorer below.</p>
<p>First, all four base conditions must be true (EMA filter, zone, RSI under 40, reversal candle). If any is missing, there is no score, there is no trade. Then add points:</p>
<ul class="checklist" id="scorer">
<li><input type="checkbox" class="sc" data-p="1" id="sc1"><label for="sc1"><strong>+1</strong> Zone has 3 or more clean touches</label></li>
<li><input type="checkbox" class="sc" data-p="1" id="sc2"><label for="sc2"><strong>+1</strong> Zone overlaps a daily or 4H level (PDL, ONL, PDC, 4H zone)</label></li>
<li><input type="checkbox" class="sc" data-p="1" id="sc3"><label for="sc3"><strong>+1</strong> First or second test of this zone</label></li>
<li><input type="checkbox" class="sc" data-p="1" id="sc4"><label for="sc4"><strong>+1</strong> 5M RSI went below 35</label></li>
<li><input type="checkbox" class="sc" data-p="1" id="sc5"><label for="sc5"><strong>+1</strong> Bullish RSI divergence at the zone</label></li>
<li><input type="checkbox" class="sc" data-p="1" id="sc6"><label for="sc6"><strong>+1</strong> Reversal candle scores 5 of 5 on the quality checklist</label></li>
<li><input type="checkbox" class="sc" data-p="1" id="sc7"><label for="sc7"><strong>+1</strong> Sweep and reclaim (wick below zone, close back inside)</label></li>
<li><input type="checkbox" class="sc" data-p="1" id="sc8"><label for="sc8"><strong>+1</strong> Reversal candle volume above the previous 3 candles</label></li>
<li><input type="checkbox" class="sc" data-p="1" id="sc9"><label for="sc9"><strong>+1</strong> Inside the primary window, 7:45 to 9:00 AM MT</label></li>
<li><input type="checkbox" class="sc" data-p="1" id="sc10"><label for="sc10"><strong>+1</strong> ES (or DXY for EUR/USD) agrees with the trade direction</label></li>
</ul>
<div class="calc"><div class="calc-out"><div><b id="scOut">0 / 10</b><span>score</span></div><div><b id="scGrade">C</b><span>grade</span></div><div><b id="scAct">Skip</b><span>action</span></div></div></div>
${T(["Score","Grade","Action"],[["8 to 10","A+","Take it"],["6 to 7","B","Take it"],["0 to 5","C","Skip and log as skipped"]])}
<p>Record the score in your journal on every trade and every skipped setup. After 100 trades you can check whether 8+ setups really outperform. That turns this checklist into your personal edge.</p>`},

{id:"w3",t:"Filters that remove losers",h:`
<h1>Filters that remove losers</h1>
<p class="lede">Each of these blocks a type of trade that tends to lose. Start with the first five. Add the rest as your data supports them.</p>
${T(["Filter","Removes"],[
["1H 20 EMA up and price above it","Buying support in downtrends, the biggest single loss source"],
["News blackout (30 min before, 15 after red events)","Random spikes through your stop"],
["Chop test fails, no trading","Slow bleed of small losses"],
["2R minimum room","Trades that cannot pay for their losers"],
["Confluence score 6+","Weak, marginal setups"],
["Zone tested 4+ times, skip","Tired levels that break"],
["5M ATR under half of normal, skip","Dead markets where targets never fill"],
["5M ATR over 2x normal, skip or half size","Wild markets with huge stops"],
["Gap of more than 1% at the open, wait 30 min","Unstable opens"],
["VIX up 10%+ on the day, half size or skip","Fear-driven, erratic tape"]])}
${B("good","How to adopt a filter","<p>Go back through your journal. Mark which past trades the filter would have removed. If removing them raises expectancy, adopt the filter. If not, drop it. Data decides, not opinions.</p>")}`},

{id:"w4",t:"Best and worst times",h:`
<h1>Best and worst times</h1>
<p class="lede">Your setup's win rate depends heavily on the clock. All times Mountain.</p>
${T(["Time (MT)","Quality","Why"],[
["6:25 to 6:45 AM","No trades","8:30 ET data releases hit at 6:30"],
["7:30 to 7:45 AM","Watch only","Open is fast and full of fake moves"],
["<strong>7:45 to 9:00 AM</strong>","<strong>Best</strong>","<strong>High volume, clean reactions at levels</strong>"],
["9:00 to 9:30 AM","Good","Still active"],
["9:30 AM to 12:00 PM","Weak","Lunch lull. Low volume, chop, setups stall"],
["12:00 PM (FOMC days)","No trades","Rate decisions"],
["12:00 to 1:30 PM","Decent","Volume returns into the close"],
["After 1:30 PM","No entries","Too close to the 2:00 PM cash close"]])}
<h2>For EUR/USD practice</h2>
${T(["Time (MT)","Quality"],[["1:00 to 6:00 AM","Mark the London range, no trades needed"],["6:30 to 10:00 AM","<strong>Best window</strong>"],["After 10:00 AM","London closed, volume fades"]])}
${B("note","Test it yourself","<p>Add an entry-time column to your journal. After 100 trades, sort by hour. Most traders find one window produces most of their profits.</p>")}`},

{id:"w5",t:"Days not to trade",h:`
<h1>Days not to trade</h1>
<p class="lede">Some days the odds are stacked against pullback strategies before the market even opens.</p>
${T(["Day","What to do"],[
["FOMC decision days","Trade the morning if you want, no entries after 11:30 AM MT, and no holding into 12:00 PM"],
["CPI or NFP days","Wait until at least 7:45 AM MT. Expect bigger moves, consider half size"],
["Market holidays and half days","Skip. Thin volume, strange moves. Check the CME holiday calendar"],
["Day before a major holiday","Often slow and choppy. Be very selective"],
["Contract roll week","Trade normally, but double check you are in the right contract"],
["Days you slept badly, are sick, or are upset","Skip. Your execution is the product"],
["After hitting your weekly loss limit","Done until Monday"],
["Megacap earnings the night before","NQ may gap. Wait 30 minutes after the open"]])}
${B("good","A missed day costs nothing","<p>There will always be another setup tomorrow. The only irreversible thing in trading is a blown account.</p>")}`},

{id:"w6",t:"Finding your edge in your own data",h:`
<h1>Finding your edge in your own data</h1>
<p class="lede">Your journal is a dataset. Once you have 100 trades, it will tell you exactly which filters to add.</p>
<h2>Tag every trade with</h2>
<ul>
<li>Entry hour</li><li>Confluence score</li><li>Zone touch count</li><li>RSI at the tag</li><li>Sweep and reclaim yes or no</li><li>Day of week</li><li>Distance from 1H EMA</li><li>Instrument</li>
</ul>
<h2>Questions to ask the data</h2>
${T(["Question","How to check in Google Sheets"],[
["Which hour makes money?","Pivot table: rows = entry hour, values = average R"],
["Do high scores really win more?","Pivot: rows = score, values = win rate and average R"],
["Is Monday or Friday worse?","Pivot: rows = day of week, values = average R"],
["Do sweeps outperform?","Filter on sweep = yes vs no, compare expectancy"],
["Am I exiting early?","Compare average planned RR vs average actual RR"]])}
${B("warn","Do not overfit","<p>If a filter only helps because of 3 or 4 trades, it is noise. Only adopt a filter that is supported by at least 20 trades on each side of the comparison.</p>")}`},

{id:"w7",t:"A+ only mode",h:`
<h1>A+ only mode</h1>
<p class="lede">A stricter rule set for evaluations and for any time your recent results slip.</p>
<ul>
<li>Only take confluence scores of <strong>8 or higher</strong></li>
<li>Only trade 7:45 to 9:00 AM MT</li>
<li>Maximum <strong>1 trade per day</strong></li>
<li>Stop after 1 loss</li>
</ul>
<p>You will trade maybe 2 or 3 times a week. That is the point. It gives you the highest win rate your strategy can produce, at the cost of fewer trades.</p>
<h2>When to switch into it</h2>
<ul>
<li>During a prop firm evaluation</li>
<li>After 3 losing days in a row</li>
<li>When your plan adherence drops below 90% for a week</li>
<li>Your first two weeks on a funded account</li>
</ul>`},

{id:"wq",t:"Check yourself: Win rate",q:[
{q:"What is the healthy way to raise win rate?",o:["Smaller targets","Wider stops","Remove low-quality setups with filters","Trade more"],a:2,e:"Filters raise win rate while keeping RR intact."},
{q:"A setup meets all 4 base conditions and scores 5 on confluence. You:",o:["Take it","Take it at half size","Skip and log it","Wait for a lower RSI"],a:2,e:"Under 6 is a C setup."},
{q:"Which time window is best for your strategy on MNQ?",o:["6:30 to 6:45 AM","7:45 to 9:00 AM","10:00 AM to 12:00 PM","1:30 to 2:00 PM"],a:1,e:"High volume and clean level reactions."},
{q:"A new filter improves results in your journal, but only 4 trades were removed. You:",o:["Adopt it","Wait for more data","Double size","Drop the strategy"],a:1,e:"Four trades is noise. Get at least 20 on each side."}
]}
]});

MODULES.push({title:"Websites and tools",lessons:[
{id:"t1",t:"TradingView: plans and account",h:`
<h1>TradingView: plans and account</h1>
<p class="lede">tradingview.com is your charting home. Here is what the free plan can and cannot do for this strategy.</p>
${T(["Need","Free plan","Paid plans"],[
["Charts, drawing tools, Bar Replay","Yes","Yes"],
["Indicators per chart","Limited (a small number, currently 2 on the free tier)","More"],
["Real-time CME futures data","Delayed","Paid real-time data add-on per exchange"],
["Multiple charts per layout","1","2 to 8+"],
["Server-side alerts","Limited","More"]])}
<p>Plan details change, so check the pricing page before you pay. For Stage 1, free is fine because your backtesting happens in FX Replay.</p>
<h2>Working around the indicator limit</h2>
<ul>
<li>Make two saved layouts: <code>1H Prep</code> with EMA and volume, and <code>5M Execute</code> with RSI and EMA</li>
<li>Use the built-in volume in the chart settings if your plan counts it as an indicator</li>
<li>Upgrade only once you move to live sim trading and need everything on one screen</li>
</ul>
${B("note","You do not need real-time futures data on TradingView","<p>Tradovate and TopstepX provide live data for execution. Delayed TradingView charts are fine for pre-market prep, since the levels come from past candles.</p>")}`},

{id:"t2",t:"TradingView: workspace setup",h:`
<h1>TradingView: workspace setup</h1>
<p class="lede">Do this once, carefully. A misconfigured chart gives you wrong levels every single day.</p>
<h2>1. Set the time zone to Denver</h2>
<p>Click the clock at the bottom right of the chart (or right-click the time axis) and pick <strong>(UTC-6) Denver</strong>. Now every candle time matches this manual.</p>
<h2>2. Turn on extended hours</h2>
<p>You need the overnight session to find ONH and ONL. Open chart settings (gear icon), Symbol tab, and enable <strong>Extended trading hours</strong> (called ETH on futures). For stocks, the same setting shows pre-market.</p>
<h2>3. Symbols you will use</h2>
${T(["Symbol","What it is"],[
["MNQ1!","Micro Nasdaq continuous front month (main chart)"],
["NQ1!","Full Nasdaq futures, same chart, often better history"],
["ES1! / MES1!","S&amp;P futures for context"],
["EURUSD","Euro vs dollar (pick a major source like OANDA or FX)"],
["AAPL","Apple"],
["VIX","Volatility index"],
["DXY","US Dollar Index"],
["US10Y","10-year Treasury yield"]])}
<h2>4. Build your watchlist</h2>
<p>Right sidebar, Watchlist, plus icon. Add every symbol above. Create a section called Context for VIX, DXY and US10Y.</p>
<h2>5. Save the layout</h2>
<p>Top right, the layout name menu, <strong>Save layout</strong>. Turn on autosave in the same menu.</p>`},

{id:"t3",t:"TradingView: drawing tools",h:`
<h1>TradingView: drawing tools</h1>
<p class="lede">The tools that mark your levels, and how to make them consistent every day.</p>
${T(["Tool","Shortcut","Use"],[
["Rectangle","Alt + Shift + R (or R on some setups)","Support and resistance zones"],
["Horizontal line","Alt + H","PDH, PDL, PDC, ONH, ONL"],
["Horizontal ray","Alt + J","Level that starts at a specific candle and extends right"],
["Long Position","toolbar only","Measure entry, stop, target and RR"],
["Text","toolbar","Labels"],
["Ruler / measure","Shift + click and drag","Quick distance in points"]],[1])}
<p>Shortcuts vary slightly by operating system and TradingView version. Hover a tool in the left toolbar to see its current shortcut.</p>
<h2>Save default styles</h2>
<p>Draw one rectangle, style it (green fill at 15% opacity, solid border), then in its floating toolbar click the template menu and choose <strong>Save as default</strong>. Every new rectangle now looks the same. Do the same for horizontal lines: red dashed for PDH and PDL, gray for PDC, orange for ONH and ONL.</p>
<h2>Favorites toolbar</h2>
<p>Star the rectangle, horizontal line and Long Position tools. A floating favorites bar appears so you do not dig through menus.</p>
<h2>Object tree</h2>
<p>The layers icon in the right sidebar lists every drawing. Use it to lock, hide, or delete drawings one at a time. Lock everything after drawing.</p>
${B("warn","Never use Remove all drawings","<p>It wipes everything with no undo. Delete old levels one at a time from the object tree instead.</p>")}`},

{id:"t4",t:"TradingView: alerts, replay and more",h:`
<h1>TradingView: alerts, replay and more</h1>
<p class="lede">The features that save you time and give you extra practice reps.</p>
<h2>Alerts</h2>
<p>Right-click a price, <strong>Add alert</strong>. Condition: Crossing. Set it just above each support zone so you know when price is approaching a setup. Also alert at your target after entering, so you can close the chart.</p>
<h2>Bar Replay</h2>
<p>Top toolbar, <strong>Replay</strong>. Click a starting point on the chart, then use step forward (one candle) or play. Great for reviewing a specific past day or practicing the morning routine on a real NQ day. Replay on some intraday timeframes may require a paid plan.</p>
<h2>Multi-timeframe drawings</h2>
<p>Drawings show on every timeframe by default. Double-click a drawing, Visibility tab, to limit it. Keep zones visible on 1H, 15M and 5M so you see them while executing.</p>
<h2>Paper trading</h2>
<p>Bottom panel, Trading Panel, Paper Trading. Useful for practicing order entry live. Your earlier screenshot shows you already have this set up on NDQ.</p>
<h2>Economic calendar</h2>
<p>Right sidebar calendar icon. A handy backup to Forex Factory for quick checks.</p>`},

{id:"t5",t:"FX Replay: complete walkthrough",h:`
<h1>FX Replay: complete walkthrough</h1>
<p class="lede">fxreplay.com is where you build your trade sample. Here is how to run it properly.</p>
<h2>Create a session</h2>
<ol>
<li>New session. Pick the instrument (EUR/USD most of the time, AAPL sometimes)</li>
<li>Starting balance: <strong>50,000</strong> to match a Topstep 50K account, or 100,000 to keep your current data comparable</li>
<li>Pick a <strong>random</strong> start date. Do not pick days you remember</li>
<li>Set the chart time zone to Denver / UTC-6 in settings if available, so session times match this manual</li>
</ol>
<h2>Chart setup inside FX Replay</h2>
<p>Add the same indicators as TradingView: EMA 20, RSI 14 with a 40 line, volume, ATR 14. Use their drawing tools for zones. Check the current free plan limits on their pricing page, since instruments and features vary by plan.</p>
<h2>Running the day</h2>
<ol>
<li>Jump to the start of the Asian session the evening before your chosen day</li>
<li>Step forward to 6:00 AM MT, marking Asian and London ranges and your 1H zones</li>
<li>Write your plan in your notebook</li>
<li>Step forward <strong>one candle at a time</strong> through your trade window</li>
<li>When a setup triggers, calculate size, place the order with stop and take profit</li>
<li>Keep stepping candle by candle while in the trade. Never fast-forward through it</li>
</ol>
<h2>Placing an order correctly</h2>
<p>Order panel, Market. Type your calculated lot size. Enable stop loss and take profit and type exact prices. Double check before submitting. Never use the preset quantity buttons.</p>
<h2>Using their stats</h2>
<p>FX Replay tracks win rate, profit factor and drawdown per session. Use them, but also log every trade in your own journal with your tags (score, time, RSI). Their stats cannot tell you which filters help.</p>`},

{id:"t6",t:"Forex Factory: complete walkthrough",h:`
<h1>Forex Factory: complete walkthrough</h1>
<p class="lede">forexfactory.com's calendar is the fastest way to know when news will hit. Check it every trading morning.</p>
<h2>One-time setup</h2>
<ol>
<li>Open the Calendar tab</li>
<li>Click the time shown at the top right and set the time zone to <strong>Mountain Time (Denver)</strong>. Create a free account so it remembers</li>
<li>Click the filter icon. Currencies: <strong>USD and EUR</strong>. Impact: <strong>High</strong> (red) and <strong>Medium</strong> (orange)</li>
<li>Save the filter</li>
</ol>
<h2>Reading the calendar</h2>
${T(["Column","Meaning"],[
["Impact folder","Red = high, orange = medium, yellow = low"],
["Actual","The released number"],
["Forecast","What economists expected"],
["Previous","Last release"],
["Graph icon","History of past releases and how price reacted"]])}
<p>The move comes from the gap between <strong>actual</strong> and <strong>forecast</strong>. A big surprise means a big move. You do not trade it. You just stay out of the way.</p>
<h2>The events to know (Mountain Time)</h2>
${T(["Event","Usual time","Impact"],[
["Non-Farm Payrolls","6:30 AM, usually first Friday","Extreme"],
["CPI","6:30 AM, monthly","Extreme"],
["FOMC statement","12:00 PM, 8 times a year","Extreme"],
["FOMC press conference","12:30 PM, same days","Extreme"],
["PCE inflation","6:30 AM, monthly","High"],
["Retail Sales","6:30 AM, monthly","High"],
["ISM Manufacturing / Services PMI","8:00 AM","Medium to high"],
["Unemployment Claims","6:30 AM, Thursdays","Medium"],
["ECB rate decision (for EUR/USD)","6:15 AM, press conference after","Extreme for EUR/USD"]],[1])}
<h2>Your daily habit</h2>
<p>7:00 AM: open the calendar, write every red and orange event time in your plan, and mark no-trade windows 30 minutes before and 15 minutes after each red one. Sunday: look at the whole week so you know which days are FOMC, CPI or NFP days.</p>`},

{id:"t7",t:"CME Group website",h:`
<h1>CME Group website</h1>
<p class="lede">cmegroup.com is the exchange itself. It is the official source for contract details.</p>
${T(["Page","What you use it for"],[
["Contract specs (search Micro E-mini Nasdaq-100)","Official tick size, tick value, trading hours, contract months"],
["Trading hours / holiday calendar","Early closes and holiday schedules, which matter for no-trade days"],
["FedWatch Tool","Market-implied probability of each Fed rate outcome. If the market is surprised on FOMC day, moves are huge"],
["Education section","Free courses on how futures work, useful background"]])}
${B("note","When specs disagree","<p>If any website, including this manual, disagrees with CME's own contract spec page, CME is right.</p>")}`},

{id:"t8",t:"Tradovate sim",h:`
<h1>Tradovate sim</h1>
<p class="lede">Your Stage 2 platform. Free futures simulation with live data so you can practice real MNQ execution.</p>
<h2>Getting started</h2>
<ol>
<li>Go to tradovate.com and choose the free simulation or demo account</li>
<li>Pick the web platform so there is nothing to install</li>
<li>Search <code>MNQ</code>, pick the front month (highest volume)</li>
<li>Set the chart to 5M, add your indicators</li>
</ol>
<h2>Set up bracket orders</h2>
<p>Tradovate lets you save automatic brackets (sometimes called order strategies). Create one with a stop and target in ticks, or adjust the attached stop and target manually each trade to match your plan. Since your stop and target change every trade, manual adjustment with a bracket attached is usually cleaner.</p>
<h2>How you use it</h2>
<ul>
<li>Keep TradingView open with your zones for analysis</li>
<li>Execute in Tradovate</li>
<li>Track 30 trading days. Your gate to Stage 3 is 30 profitable days with no daily loss limit breaches</li>
</ul>
<p>Demo terms and features change, so check the current offer on their site.</p>`},

{id:"t9",t:"TopstepX",h:`
<h1>TopstepX</h1>
<p class="lede">Topstep's own trading platform, used for the Trading Combine and funded accounts.</p>
<ul>
<li><strong>Built-in TradingView charts</strong>, so your drawing habits carry over</li>
<li><strong>Personal daily loss limit and profit target settings.</strong> Set your own daily loss limit tighter than Topstep's rules. The platform will stop you before you break your own rule</li>
<li><strong>Flatten button</strong> that closes all positions instantly. Know where it is before your first trade</li>
<li><strong>Account dashboard</strong> showing your Maximum Loss Limit level in real time. Check it before each trade</li>
</ul>
${B("note","Where to find current rules","<p>help.topstep.com is the official help center. Rules have changed several times in 2025 and 2026. Always read it there, not on third-party sites.</p>")}`},

{id:"t10",t:"Other useful sites",h:`
<h1>Other useful sites</h1>
<p class="lede">Optional tools that add context. None of them replace your routine.</p>
${T(["Site","Use"],[
["finviz.com","Heat map of the S&amp;P 500 to see at a glance whether tech is leading or lagging today"],
["investing.com","Backup economic calendar and earnings calendar"],
["nasdaq.com earnings calendar","Check megacap earnings dates for the week"],
["help.topstep.com","Official, current Topstep rules"],
["Google Sheets","Your trade journal (template in Module 11)"]])}`},

{id:"t11",t:"Journaling tools",h:`
<h1>Journaling tools</h1>
<p class="lede">A journal is required. Which tool you use is not.</p>
${T(["Tool","Cost","Notes"],[
["<strong>Trade log (in this app)</strong>","Free","Built in. Automatic stats, equity curve, Stage 1 gates, CSV export"],
["<strong>Google Sheets</strong>","Free","Full control, easy pivot tables, recommended to start. Template in Module 11"],
["FX Replay stats","Included","Good summary numbers, but no custom tags"],
["TradeZella, Tradervue, Edgewonk","Paid","Auto-import from brokers, nice charts. Worth it only once you trade live sim daily"],
["Notion","Free","Great for screenshots and written notes. Pair it with Sheets for the numbers"]])}
${B("good","Use your existing Notion habit","<p>You already use Notion for lecture notes. A Notion database with one page per trading day, holding your handwritten plan photo, screenshots and a short reflection, pairs well with a Sheets journal for the stats.</p>")}`},

{id:"t12",t:"Red flags and scams",h:`
<h1>Red flags and scams</h1>
<p class="lede">Trading attracts a lot of people selling shortcuts. Here is how to spot them.</p>
${T(["Red flag","Why"],[
["Guaranteed returns or 90% win rates","No real strategy can promise this"],
["Paid signal groups","You learn nothing and depend on someone whose real results you cannot verify"],
["'Get funded in 7 days' courses","Pass rates are low, and speed is the opposite of what works"],
["Account management or passing services","Someone else trading your evaluation. Against prop firm rules, can get you banned"],
["Lifestyle marketing (cars, rented mansions)","Income from selling courses, not from trading"],
["Screenshots of huge single-day wins","Easy to fake, and they never show the losing days"],
["Pressure to join now or miss out","Classic sales pressure"]])}
${B("note","Good sources exist","<p>Official exchange education (CME), prop firm help centers, well-known books (Module 13), and your own data are enough. You do not need a paid guru.</p>")}`},

{id:"t13",t:"Using Claude as your practice partner",h:`
<h1>Using Claude as your practice partner</h1>
<p class="lede">Pause FX Replay, screenshot the chart, and ask Claude to check it against your rules. Used the right way, it speeds up learning a lot.</p>
<h2>The workflow</h2>
<ol>
<li><strong>Pause</strong> the replay when price enters one of your zones, before the reversal candle closes</li>
<li><strong>Write your own call first</strong> in your notebook: valid or not, which conditions pass, your confluence score</li>
<li><strong>Screenshot and send</strong> with your call included</li>
<li><strong>Compare</strong> Claude's answer with yours. Where you disagree is exactly what to study</li>
<li><strong>Step forward</strong> to the candle close and send one more screenshot to check entry, stop, target and size</li>
<li><strong>Log the trade</strong> in the Trade log when it finishes</li>
</ol>
${B("good","Guess first, then check","<p>If you ask before thinking, you learn slowly and start depending on the answer. If you commit to a call first and then check, every mismatch teaches you something. Track how often your call matches. That number should climb over time.</p>")}
<h2>What to include in the screenshot</h2>
<ul>
<li>The 5M chart with your zones drawn and the RSI panel visible underneath</li>
<li>The price scale on the right and candle times along the bottom (Denver time)</li>
<li>The 1H chart as a second screenshot, or a note saying whether price is above a rising 20 EMA</li>
<li>Instrument, account size and risk per trade</li>
</ul>
<h2>Prompts you can copy</h2>
${P("PAUSED IN A ZONE\nPrice just entered S1 on EUR/USD 5M. My call: not valid yet,\nwaiting for a reversal candle. RSI is 36. What am I missing?\n\nAT THE CLOSE\nCandle closed. Entry 1.08500, stop 1.08320, target 1.08920.\n50K account, 0.4% risk. Check all 4 conditions, RR,\nconfluence score and lot size.\n\nZONE CHECK\nHere are today's 3 zones on the 1H. Would you rank them\nthe same way? Anything I should have marked?\n\nAFTER THE TRADE\nClosed at 1.08880. What was the R, and did I break any rule?\n\nWEEKLY REVIEW\nHere is my Trade log CSV for the week. What patterns do you\nsee, and what should my one focus be next week?")}
<h2>Use a Claude Project</h2>
<p>Create a Claude Project, upload the manual's knowledge file, and add short instructions describing your strategy. Every chat in that project will already know your rules, so you can send a screenshot without explaining anything.</p>
${B("warn","Limits to keep in mind","<ul><li>Small numbers in screenshots can be misread. Type any price that matters</li><li>Claude checks your rules. It does not predict whether a trade will win</li><li>Use this for backtesting and reviews. In live trading, the delay can break your chase rule, and your written plan should already make the decision</li></ul>")}`},

{id:"tq",t:"Check yourself: Tools",q:[
{q:"Why set TradingView's time zone to Denver?",o:["Required by TradingView","So candle times match this manual's MT schedule","It changes the price data","It speeds up the chart"],a:1,e:"Every level and time window in this manual is in Mountain Time."},
{q:"Which TradingView setting lets you see the overnight high and low on MNQ?",o:["Log scale","Extended trading hours","Heikin Ashi","Auto scale"],a:1,e:"Without extended hours you only see the cash session."},
{q:"In Forex Factory, what causes the big move on a release?",o:["The Previous number","The gap between Actual and Forecast","The impact color","The time zone"],a:1,e:"Surprise relative to forecast drives the reaction."},
{q:"Where should you check current Topstep rules?",o:["YouTube","Reddit","help.topstep.com","A Discord server"],a:2,e:"The official help center is the only reliable source."}
]}
]});
MODULES.push({title:"Risk management",lessons:[
{id:"r1",t:"The rules that keep you alive",h:`
<h1>The rules that keep you alive</h1>
<p class="lede">Not guidelines. These rules keep you in the game long enough for your edge to show up.</p>
${T(["#","Rule"],[
["1","Risk <strong>0.5% per trade</strong> in backtesting and sim. On a Topstep 50K, risk <strong>$150 to $200</strong> (explained in the streak lesson). 1% is the absolute ceiling, ever"],
["2","<strong>Maximum 2 trades per day</strong>"],
["3","<strong>Stop for the day after 2 losses</strong>"],
["4","<strong>Weekly loss limit 3%</strong> of account (or 3R on a funded account). Hit it and you are done until Monday"],
["5","<strong>Never move a stop further away</strong>"],
["6","<strong>Never add to a losing position</strong>"],
["7","<strong>Every trade has a stop the moment it is entered</strong>"],
["8","<strong>No entries 30 min before or 15 min after red news</strong>"],
["9","<strong>Size comes from the formula</strong>, never from confidence"]],[0])}
${B("good","Make it physical","<p>Write these on an index card and tape it to your monitor. At the moment you want to break one, seeing it matters more than you would expect.</p>")}
${B("note","Why these differ slightly from earlier","<p>Earlier versions said 3 losses and a 2% daily limit. With a 2-trades-per-day cap, stopping after 2 losses is cleaner and caps any day at about 1R to 2R.</p>")}`},

{id:"r2",t:"Position sizing for every instrument",h:`
<h1>Position sizing for every instrument</h1>
<p class="lede">One formula. Different dollar values per point.</p>
${P("Size = Dollar risk / (Stop distance x Dollar value per unit of distance)\n\nAlways round DOWN.")}
${T(["Instrument","Distance unit","Dollar value","Example: $250 risk"],[
["MNQ","points","$2 per point per contract","30 pt stop -> 250/60 = 4 contracts"],
["MES","points","$5 per point per contract","10 pt stop -> 250/50 = 5 contracts"],
["NQ","points","$20 per point","30 pt stop -> 250/600 = 0, too big. Use MNQ"],
["EUR/USD","pips","$10 per pip per standard lot","18 pip stop -> 250/180 = 1.38 lots -> 1.3"],
["AAPL / stocks","dollars","$1 per $1 per share","$0.70 stop -> 250/0.70 = 357 shares"],
["BTC","dollars","$1 per $1 per coin","$800 stop -> 250/800 = 0.31 BTC"]])}
${B("warn","The stop comes first","<p>Place the stop where the structure says. Then calculate size. Never shrink the stop to fit more contracts. If the correct stop means 1 contract, you trade 1 contract. If it means zero, you skip.</p>")}`},

{id:"r3",t:"Live calculator",h:`
<h1>Live calculator</h1>
<p class="lede">Use this before every trade until the math is automatic.</p>
<div class="calc" id="posCalc">
<div class="calc-grid">
<div><label for="cInst">Instrument</label><select id="cInst">
<option value="MNQ">MNQ ($2 / pt)</option><option value="MES">MES ($5 / pt)</option><option value="NQ">NQ ($20 / pt)</option><option value="ES">ES ($50 / pt)</option><option value="EURUSD">EUR/USD (std lots)</option><option value="STOCK">Stock (shares)</option></select></div>
<div><label for="cAcct">Account size ($)</label><input id="cAcct" type="number" value="50000"></div>
<div><label for="cRisk">Risk per trade (%)</label><input id="cRisk" type="number" step="0.05" value="0.4"></div>
<div><label for="cEntry">Entry price</label><input id="cEntry" type="number" step="any" value="30218"></div>
<div><label for="cStop">Stop price</label><input id="cStop" type="number" step="any" value="30182"></div>
<div><label for="cTgt">Target price</label><input id="cTgt" type="number" step="any" value="30312"></div>
</div>
<div class="calc-out">
<div><b id="oRisk">-</b><span>dollar risk budget</span></div>
<div><b id="oSize">-</b><span>position size</span></div>
<div><b id="oAct">-</b><span>actual risk</span></div>
<div><b id="oRR">-</b><span>reward to risk</span></div>
<div><b id="oRew">-</b><span>reward if target hits</span></div>
</div>
<div class="calc-msg" id="oMsg"></div>
</div>
<p>EUR/USD: enter prices like 1.08500. Stocks: enter prices in dollars. The calculator rounds size down and flags any trade under 2R.</p>`},

{id:"r4",t:"Thinking in R",h:`
<h1>Thinking in R</h1>
<p class="lede">R is one unit of risk. Measuring everything in R makes your results comparable across account sizes and keeps emotions out of dollar amounts.</p>
${P("R-multiple = (Exit - Entry) / (Entry - Stop)     for a long\n\nEntry 30,218  Stop 30,182  (1R = 36 pts)\nExit 30,312  -> (94) / 36  = +2.6R\nExit 30,182  -> (-36) / 36 = -1.0R\nExit 30,236  -> (18) / 36  = +0.5R  (closed early)")}
<h2>Why this helps you</h2>
<ul>
<li>Your journal's key column is R, not dollars</li>
<li>Average R per trade is your expectancy</li>
<li>Scaling up later (bigger account, more accounts) does not change your stats</li>
<li>A -1R day feels the same as it should whether R is $50 or $500</li>
</ul>
${B("good","A healthy R distribution","<p>Most losses should be exactly -1R (plus a little slippage). Most wins should be near your planned RR. Lots of wins at +0.5R mean you are closing early. Losses bigger than -1.2R mean stops are being moved or skipped.</p>")}`},

{id:"r5",t:"Losing streaks and risk of ruin",h:`
<h1>Losing streaks and risk of ruin</h1>
<p class="lede">Losing streaks are guaranteed. Size so the normal worst case cannot end your account.</p>
<p>A rough rule for the longest losing streak you should expect over N trades:</p>
${P("Expected longest streak = ln(N) / ln(1 / loss rate)")}
${T(["Win rate","Over 100 trades","Over 250 trades"],[
["40%","about 9","about 11"],["43.5% (you)","about 8","about 10"],["50%","about 7","about 8"],["55%","about 6","about 7"]],[1,2])}
<p>These are typical, not worst case. Streaks longer than this do happen.</p>
<h2>What 10 losses in a row costs</h2>
${T(["Risk per trade","Drawdown after 10 losses"],[["0.25%","2.5%"],["0.5%","4.9%"],["1%","9.6%"],["2%","18.3%"],["5%","40.1%"]],[0,1])}
<h2>The Topstep connection</h2>
<p>A 50K Combine has a $2,000 Maximum Loss Limit. At $250 per trade, 8 losses in a row ends the account, and 8 is a normal streak at your win rate. At $200 per trade you can absorb 10. At $150, about 13.</p>
${B("warn","Size for the account's limit, not its size","<p>Risk no more than roughly one tenth of the maximum drawdown per trade. On a 50K Topstep account that means $200 or less per trade until you have built a profit cushion.</p>")}
<h2>Streak and expectancy calculator</h2>
<div class="calc">
<div class="calc-grid">
<div><label for="eWin">Win rate (%)</label><input id="eWin" type="number" value="43.5"></div>
<div><label for="eRR">Average win (R)</label><input id="eRR" type="number" step="0.1" value="1.8"></div>
<div><label for="eN">Number of trades</label><input id="eN" type="number" value="100"></div>
<div><label for="eR">Dollars per R</label><input id="eR" type="number" value="200"></div>
</div>
<div class="calc-out">
<div><b id="eExp">-</b><span>expectancy per trade</span></div>
<div><b id="eTot">-</b><span>expected total</span></div>
<div><b id="eStr">-</b><span>typical longest losing streak</span></div>
<div><b id="eDD">-</b><span>that streak in dollars</span></div>
<div><b id="eBE">-</b><span>break-even win rate</span></div>
</div>
</div>`},

{id:"r6",t:"Drawdown math",h:`
<h1>Drawdown math</h1>
<p class="lede">Losses hurt more than equal gains help. This is why small risk wins long term.</p>
${T(["Account drops by","Gain needed to recover"],[["5%","5.3%"],["10%","11.1%"],["20%","25%"],["30%","42.9%"],["50%","100%"],["75%","300%"]],[0,1])}
<p>Small drawdowns are easy to climb out of. Big ones are nearly impossible. Keeping each loss at 0.5% keeps you in the top rows of this table.</p>
<h2>Trailing drawdown on prop accounts</h2>
<p>Topstep's Maximum Loss Limit trails your end-of-day high balance and is enforced in real time, including open losses. If you are up $1,500 and then give back $2,000, you fail even though you are still above your starting balance overall. Give-backs after a good run are the most common way people fail.</p>
${B("good","Protect the peak","<p>After a big green day, drop to A+ only mode for the next session. The trailing limit punishes give-backs much more than slow starts.</p>")}`},

{id:"r7",t:"Trading costs and realistic fills",h:`
<h1>Trading costs and realistic fills</h1>
<p class="lede">Commissions, fees and slippage are small per trade but add up across hundreds. Tight stops make them much bigger in R.</p>
<h2>What each trade costs</h2>
${T(["Cost","Typical on MNQ","Notes"],[
["Commission plus exchange fees","Often roughly $0.50 to $1.50 per contract, round trip","Varies by platform. Check the fee page for Tradovate or Topstep"],
["Slippage on stop exits","About 1 tick ($0.50) per contract","More around news and the open"],
["Slippage on entries","0 to 1 tick","Market orders at the close"],
["Evaluation and data fees","Monthly","A business expense. Budget it separately"]])}
<h2>Why tight stops cost more</h2>
${P("Same $200 risk, about $1.50 per contract all-in costs\n\n30 pt stop -> 3 contracts  -> costs about $4.50  = 0.02R\n8 pt stop  -> 12 contracts -> costs about $18.00 = 0.09R")}
<p>A tighter stop means more contracts to keep the same dollar risk, so costs rise. Tight stops also get hit more often by normal noise. That is one more reason to use the ATR-based stop instead of squeezing it.</p>
<h2>Realistic fills in backtesting</h2>
<ul>
<li><strong>Limit targets:</strong> in a simulator, a limit often fills the moment price touches it. Live, it may only fill once price trades through it. Your front-run rule (target a few ticks early) protects you from this</li>
<li><strong>Stops:</strong> in fast moves they fill worse than the stop price</li>
<li><strong>Rule of thumb:</strong> if your backtest tool does not model costs, subtract about 0.05R from every trade when calculating expectancy</li>
</ul>
${B("note","Check your current numbers","<p>With a 1.8R average and a 43.5% win rate, costs of 0.05R per trade take expectancy from +0.22R to about +0.17R. Still positive, but it shows why getting to 2R matters.</p>")}`},


{id:"rq",t:"Check yourself: Risk",q:[
{q:"$200 risk, 25-point MNQ stop. How many contracts?",o:["2","4","5","8"],a:1,e:"25 x $2 = $50 per contract. $200 / $50 = 4."},
{q:"Your journal shows many wins at +0.5R while planning 2R. That means:",o:["Great risk control","You are closing winners early","Stops are too tight","Nothing"],a:1,e:"Actual R far below planned R points to early exits."},
{q:"On a 50K Topstep with a $2,000 MLL, why not risk $250 per trade?",o:["Against the rules","An ordinary 8-trade losing streak would end the account","Too few contracts","It is fine"],a:1,e:"Your normal expected streak is about 8 at a 43.5% win rate."},
{q:"An account down 50% needs what gain to recover?",o:["50%","75%","100%","150%"],a:2,e:"Half the money has to double to get back."},
{q:"Why do very tight stops raise your costs in R?",o:["Commissions are higher on tight stops","You need more contracts for the same dollar risk","Brokers charge extra","They do not"],a:1,e:"More contracts means more commission and slippage per trade."}
]}
]});

MODULES.push({title:"Daily routine",lessons:[
{id:"d1",t:"Futures morning routine (MT)",h:`
<h1>Futures morning routine (MT)</h1>
<p class="lede">For live sim and funded trading on MNQ. The cash open is 7:30 AM MT. Your routine starts at 7:00.</p>
${T(["Time","Action"],[
["6:45","Up, water, coffee. No social media. Clear head"],
["7:00","<strong>Forex Factory.</strong> Write every red and orange event time. Mark blackout windows"],
["7:03","<strong>Context glance:</strong> ES, VIX, DXY, US10Y, any megacap earnings last night"],
["7:05","<strong>Clear old drawings</strong> one at a time from the object tree"],
["7:07","<strong>Daily chart:</strong> mark PDH, PDC, PDL with horizontal lines. Lock"],
["7:10","<strong>5M chart, extended hours on:</strong> find the high and low since 4:00 PM MT yesterday. Mark ONH and ONL. Lock"],
["7:13","<strong>1H chart:</strong> price vs 20 EMA and slope. Below or falling means no longs today"],
["7:15","<strong>Draw up to 3 zones</strong> on 1H. Score them. Label with score. Lock"],
["7:22","<strong>Set alerts</strong> just above each zone"],
["7:25","<strong>Write the plan by hand</strong> and sign it"],
["7:30","Open. Watch only"],
["7:30 to 7:45","Note the opening range high and low. Is the tape trending or choppy?"],
["7:45 to 9:00","<strong>Primary window.</strong> Execute only setups in your plan"],
["9:00 to 12:00","A+ only, or step away"],
["12:00 to 1:30","Secondary window, same rules"],
["1:30","No new entries"],
["2:00 to 2:30","Review and journal"]],[0])}`},

{id:"d2",t:"EUR/USD practice routine (MT)",h:`
<h1>EUR/USD practice routine (MT)</h1>
<p class="lede">For FX Replay sessions. You run this on a historical day, stepping through as if it were live.</p>
${T(["Replay time (MT)","Action"],[
["Previous day 5:00 PM to 1:00 AM","Mark the Asian session high and low"],
["1:00 to 6:00 AM","Mark the London session high and low. Note London's direction"],
["6:00 AM","Daily chart: previous day high, low, close"],
["6:05","1H chart: price vs 20 EMA. Draw up to 3 zones and score them"],
["6:15","Check that day's calendar for USD and EUR news (Forex Factory history)"],
["6:25","Write the plan"],
["6:30","US data hits. Watch only until 6:45"],
["6:45 to 10:00","<strong>Trading window.</strong> Step one candle at a time"],
["10:00","London closes. Stop taking new setups"],
["After","Log every trade and every skipped setup"]],[0])}
${B("note","Asian and London ranges work like overnight levels","<p>Treat the Asian low and London low like ONL. Treat the London high like ONH. Zones that overlap them score a point.</p>")}`},

{id:"d3",t:"The daily plan template",h:`
<h1>The daily plan template</h1>
<p class="lede">Handwrite this every morning. Paper beats typing because it forces you to slow down.</p>
${P("DATE ____________  INSTRUMENT ______  ACCOUNT $________\n\nNEWS (red / orange)\n  ______  ____________________   blackout ______-______\n  ______  ____________________   blackout ______-______\n\nCONTEXT   ES vs 1H EMA: above / below    VIX ______\n\nLEVELS\n  PDH ________  PDC ________  PDL ________\n  ONH ________  ONL ________\n\nTREND  1H price vs 20 EMA: ABOVE / BELOW   slope: UP / FLAT / DOWN\n       If BELOW or DOWN -> no longs today\n\nZONES (max 3)\n  S1 ________ - ________  touches __  score __\n  S2 ________ - ________  touches __  score __\n  S3 ________ - ________  touches __  score __\n\nRISK   $ per trade ______   max trades 2   stop after 2 losses\n\nI only take trades that match this plan.\nSigned ________________")}`},

{id:"d4",t:"During the session",h:`
<h1>During the session</h1>
<p class="lede">Most of trading is waiting. Here is what to do with that time and exactly what to check when price reaches a zone.</p>
<h2>While waiting</h2>
<ul>
<li>Let alerts tell you when price nears a zone. You do not need to watch every tick</li>
<li>Keep this manual or a textbook open. Waiting at the chart invites boredom trades</li>
<li>If nothing happens by 9:00 AM MT, that is a normal day</li>
</ul>
<h2>When an alert fires</h2>
<ol>
<li>Switch to 5M. Is price inside the zone?</li>
<li>Watch RSI. Below 40?</li>
<li>Wait for a candle to close. Does it qualify?</li>
<li>Run the confluence score</li>
<li>Run the calculator. RR 2.0+?</li>
<li>Order checklist, then enter with a bracket</li>
<li>Set a target alert and close the 5M chart</li>
</ol>
<h2>After entering</h2>
<p>Do not watch the P&amp;L. Do not touch the stop or target. Go do something else. Come back when an alert fires.</p>`},

{id:"d5",t:"After the session",h:`
<h1>After the session</h1>
<p class="lede">15 to 30 minutes, every trading day. This is where improvement actually happens.</p>
<ol>
<li>Screenshot every trade with entry, stop, target and zones visible</li>
<li>Log each trade in your journal with all tags</li>
<li>Log every skipped setup and why</li>
<li>Answer: did I follow my plan on every trade? Yes or no</li>
<li>Write one sentence: what would I do differently?</li>
<li>Note today's 5M ATR so you learn what normal looks like</li>
</ol>
${B("good","Grade yourself, not the result","<p>A loss where you followed every rule is an A day. A win where you broke a rule is an F day, because it teaches you the wrong lesson.</p>")}`},

{id:"d6",t:"Weekly and monthly reviews",h:`
<h1>Weekly and monthly reviews</h1>
<p class="lede">The review is where your journal turns into better rules.</p>
<h2>Weekly, Sunday, 30 to 45 minutes</h2>
<ol>
<li>Calculate: trades, win rate, average R, expectancy, plan adherence %</li>
<li>Best trade: write why it worked</li>
<li>Worst trade: write what happened and whether a rule was broken</li>
<li>Check planned RR vs actual RR</li>
<li>Look at next week's calendar: mark FOMC, CPI, NFP days</li>
<li>Pick <strong>one</strong> focus for next week</li>
</ol>
<h2>Monthly, first weekend</h2>
<ol>
<li>Full stats for the month (Module 11 list)</li>
<li>Pivot by hour, score, and day of week</li>
<li>Decide on at most one rule change, backed by 20+ trades of evidence</li>
<li>Check progress against your stage gate</li>
</ol>`},

{id:"d7",t:"Fitting it around ACC",h:`
<h1>Fitting it around ACC</h1>
<p class="lede">School comes first. Here is how to make trading fit around your schedule at each stage.</p>
${T(["Your day","Stage 1 (now)","Stage 2 and later"],[
["No class before 10 AM","Watch the open 7:30 to 9:00 AM MT, practice spotting setups live","Trade the primary window"],
["Class at 8 or 9 AM","Skip the live market. Backtest that evening","Skip trading that day, or trade the 12:00 to 1:30 PM window only if free"],
["Afternoon free","Backtest or review","Secondary window 12:00 to 1:30 PM"],
["Exam week","Stop trading and backtesting. Study","Same"]])}
${B("note","A useful overlap","<p>Your stats class covers sample sizes and variance, and your accounting class covers record keeping. Both are exactly the skills your journal and backtest analysis need.</p>")}`},

{id:"d8",t:"Your setup and backup plan",h:`
<h1>Your setup and backup plan</h1>
<p class="lede">Your internet will drop and your platform will freeze at some point. Plan for it now, while nothing is at risk.</p>
<h2>Equipment</h2>
${T(["Item","Need","Nice to have"],[
["Computer","Any laptop that runs a browser smoothly","A second monitor: charts on one, platform on the other"],
["Internet","Home connection, wired if possible","Phone hotspot as backup"],
["Phone","Platform app installed and already logged in",""],
["Power","Charged laptop battery","Small battery backup for the router"]])}
<h2>If something breaks mid-trade</h2>
<ol>
<li><strong>Do not panic.</strong> Bracket orders on most futures platforms sit on the broker's servers, so your stop and target stay active even if your computer disconnects. Confirm this for your platform before you trade live sim</li>
<li>Switch to your phone hotspot or the phone app</li>
<li>If you still cannot reach the platform, call the trade desk. Save the phone number for Tradovate and Topstep in your contacts today</li>
<li>Log what happened and how long it took to recover</li>
</ol>
<h2>Security</h2>
<ul>
<li>Turn on two-factor authentication for your email, TradingView, and prop firm accounts</li>
<li>Never share login details with anyone, including people offering to trade your evaluation</li>
</ul>
<h2>Monthly test</h2>
<ul class="checklist">
<li><input type="checkbox" id="bk1"><label for="bk1">Phone app logs in and shows positions</label></li>
<li><input type="checkbox" id="bk2"><label for="bk2">Hotspot works on the laptop</label></li>
<li><input type="checkbox" id="bk3"><label for="bk3">Trade desk numbers saved</label></li>
<li><input type="checkbox" id="bk4"><label for="bk4">Know where the flatten button is</label></li>
</ul>`},


{id:"dq",t:"Check yourself: Routine",q:[
{q:"What is the first thing you do at 7:00 AM MT?",o:["Draw zones","Check Forex Factory","Enter a trade","Check P&amp;L"],a:1,e:"News times shape the whole plan."},
{q:"Where does the overnight range start for MNQ?",o:["4:00 PM MT the previous day","Midnight","5:00 AM MT","7:30 AM MT"],a:0,e:"Globex reopens at 4:00 PM MT."},
{q:"You lost following every rule. How do you grade the day?",o:["F","C","A","It depends on P&amp;L"],a:2,e:"Grade process, not outcome."},
{q:"Class at 8 AM today during Stage 1. You:",o:["Skip class","Trade from your phone","Backtest that evening","Trade the first 5 minutes"],a:2,e:"School first. Backtesting works any time."}
]}
