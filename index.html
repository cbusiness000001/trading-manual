MODULES.push({title:"Psychology",lessons:[
{id:"y1",t:"Process over outcome",h:`
<h1>Process over outcome</h1>
<p class="lede">Any single trade is mostly luck. Your process over hundreds of trades is skill.</p>
<p>At a 45% win rate you will lose more trades than you win. A great trade can lose and a terrible trade can win. If you judge yourself by each result, you will keep changing what works and keep what does not.</p>
${T(["","Followed plan","Broke plan"],[
["Won","Good trade","Dangerous. Teaches you to break rules"],
["Lost","Good trade. Cost of business","Bad trade. Learn from it"]])}
${B("good","The one sentence","<p>You are not trying to win this trade. You are trying to execute your process correctly 500 times so the math can play out.</p>")}`},

{id:"y2",t:"Biases that cost traders",h:`
<h1>Biases that cost traders</h1>
<p class="lede">Your brain has shortcuts that work great in daily life and badly in markets.</p>
${T(["Bias","In trading","Counter"],[
["Loss aversion","Holding losers hoping they come back, closing winners early to lock in","Bracket orders set at entry"],
["Recency bias","Three losses make you think the strategy is broken","Judge only on 50+ trade samples"],
["Confirmation bias","Seeing a setup because you want to trade","Pre-marked zones and a written plan"],
["Gambler's fallacy","Thinking a win is due after losses","Each trade is independent"],
["Overconfidence","Sizing up after a hot streak","Size is a formula"],
["Sunk cost","Refusing to take a loss because you already lost so much","The stop is the decision, made in advance"],
["FOMO","Chasing a move without you","If it did not come to your zone, nothing was missed"]])}`},

{id:"y3",t:"Tilt: spotting and stopping it",h:`
<h1>Tilt: spotting and stopping it</h1>
<p class="lede">Tilt is trading from emotion instead of rules. It usually starts after a loss or a missed move.</p>
<h2>Warning signs</h2>
<ul class="checklist">
<li><input type="checkbox" id="tl1"><label for="tl1">Wanting to win back a loss right now</label></li>
<li><input type="checkbox" id="tl2"><label for="tl2">Entering before the candle closes</label></li>
<li><input type="checkbox" id="tl3"><label for="tl3">Considering a bigger size than the formula says</label></li>
<li><input type="checkbox" id="tl4"><label for="tl4">Drawing new zones mid-session</label></li>
<li><input type="checkbox" id="tl5"><label for="tl5">Feeling hot in the face, jaw clenched, fast breathing</label></li>
<li><input type="checkbox" id="tl6"><label for="tl6">Staring at P&amp;L instead of the chart</label></li>
</ul>
<h2>The reset protocol</h2>
<ol>
<li>Any 2 signs: close the trading platform, not just the order window</li>
<li>Stand up and leave the room for 15 minutes</li>
<li>Write what you felt and what triggered it</li>
<li>If it happens twice in one day, you are done for the day</li>
</ol>`},

{id:"y4",t:"System fixes for emotional mistakes",h:`
<h1>System fixes for emotional mistakes</h1>
<p class="lede">Willpower runs out. Systems do not. Each fix makes the mistake physically harder to make.</p>
${T(["Mistake","System fix"],[
["Closing winners early","Bracket with a limit target at entry, set an alert, close the chart"],
["Moving stops","Stop attached at entry. If you reach for it, close the whole trade instead"],
["Revenge trading","2 losses and done. Set TopstepX personal daily loss limit tighter than the firm's"],
["Overtrading","Max 2 trades written in your plan. Something scheduled at 9:00 AM"],
["Oversizing","Calculator every trade. Write size in the plan before the open"],
["Chasing","The 0.3R chase rule. Missed is missed"],
["Boredom trades","Leave the screen when there is no setup near"]])}`},

{id:"y5",t:"Handling streaks",h:`
<h1>Handling streaks</h1>
<p class="lede">Both winning and losing streaks try to change your behavior. Neither should.</p>
<h2>Losing streak</h2>
<ul>
<li>Check your journal: were the losses rule-following? If yes, this is variance. Keep going</li>
<li>After 3 losing days in a row, switch to A+ only mode</li>
<li>After a losing week, review the week's trades before trading again</li>
<li>Never increase size to recover</li>
</ul>
<h2>Winning streak</h2>
<ul>
<li>Size stays the same</li>
<li>After a big green day, next session is A+ only</li>
<li>Watch for skipped checklists. Confidence makes people sloppy</li>
</ul>
${B("note","Expect it","<p>Your math says an 8-loss streak is normal over 100 trades. When it comes, you will already know it is part of the plan.</p>")}`},

{id:"y6",t:"Body basics",h:`
<h1>Body basics</h1>
<p class="lede">Your decisions are only as good as your brain on that morning.</p>
<ul>
<li><strong>Sleep:</strong> under 6 hours means skip or A+ only</li>
<li><strong>Caffeine:</strong> one normal coffee, not three. Jittery hands press buttons</li>
<li><strong>Food:</strong> eat something before 7:30. Hunger makes you impatient</li>
<li><strong>Movement:</strong> a short walk after the primary window resets your head</li>
<li><strong>Screens:</strong> close social media and Discord during the session</li>
</ul>`},

{id:"yq",t:"Check yourself: Psychology",q:[
{q:"You broke a rule and the trade won. That was:",o:["A good trade","A bad trade","Neutral","Proof the rule is wrong"],a:1,e:"It rewards rule-breaking, which costs you later."},
{q:"After three losses you feel the strategy is broken. That is most likely:",o:["Correct","Recency bias","Confirmation bias","Overconfidence"],a:1,e:"Three trades is far too few to judge anything."},
{q:"You notice two tilt signs. First step?",o:["Trade smaller","Close the platform","Switch to 1M","Keep going"],a:1,e:"Remove the ability to act, then reset."}
]}
]});
MODULES.push({title:"Backtesting and data",lessons:[
{id:"b1",t:"Backtesting honestly",h:`
<h1>Backtesting honestly</h1>
<p class="lede">A backtest is only useful if it reflects how you would really trade. These are the ways people fool themselves.</p>
${T(["Trap","What it looks like","Fix"],[
["Hindsight","You can see what happened next, so setups look obvious","Step candle by candle, never peek ahead"],
["Cherry-picked days","Testing days you remember as good","Random start dates, and test every day in a row once started"],
["Skipping ahead in a trade","Fast-forwarding to the result","Step through every candle while in a trade"],
["Changing rules mid-test","Tweaking after losses","Freeze rules for the full sample. Change only between tests"],
["Ignoring costs","No slippage or commissions","Subtract 1 tick slippage plus commission per side"],
["Counting only taken trades","Forgetting skipped setups","Log skipped setups with their would-be outcome"]])}
${B("good","A good session feels slow and a little boring","<p>If backtesting feels exciting and fast, you are probably skipping ahead or taking marginal setups.</p>")}`},

{id:"b2",t:"Sample size and variance",h:`
<h1>Sample size and variance</h1>
<p class="lede">Why your 23-trade win rate cannot be trusted yet, shown with the same math from your stats class.</p>
<p>The margin of error on a win rate is roughly:</p>
${P("Margin (95%) = 1.96 x sqrt( p x (1 - p) / n )\n\np = 0.435\nn = 23   ->  +/- 20 percentage points   (23% to 64%)\nn = 100  ->  +/- 10 points                (34% to 53%)\nn = 250  ->  +/- 6 points                 (37% to 50%)")}
<p>At 23 trades your true win rate could be anywhere from bad to excellent. At 100 you have a usable estimate. At 250 you have a reliable one.</p>
${B("note","What this means for decisions","<p>Do not change rules based on fewer than 50 trades. Do not judge a filter on fewer than 20 trades on each side. Do not pay for an evaluation until you have at least 100.</p>")}`},

{id:"b3",t:"The stats that matter",h:`
<h1>The stats that matter</h1>
<p class="lede">Calculate these every month. Together they tell you if you have an edge and where it leaks.</p>
${T(["Stat","Formula","Target"],[
["Win rate","Wins / total trades","45%+ after filters"],
["Average win (R)","Average R of winning trades","2.0R+"],
["Average loss (R)","Average R of losing trades","-1.0R, never worse than -1.1R"],
["Expectancy","Average R across all trades","+0.3R or better"],
["Profit factor","Total R won / total R lost","1.5+ (you are about 1.4 now)"],
["Max drawdown","Largest peak-to-trough drop in R","Under 8R"],
["Longest losing streak","Count","Know it, compare to Module 8 table"],
["Planned vs actual RR","Average planned RR minus average actual R on winners","Under 0.2R gap"],
["Plan adherence","Trades that followed every rule / total","95%+"],
["Trades per week","Count","Steady, not spiking"]],[1])}`},

{id:"b4",t:"Build your journal spreadsheet",h:`
<h1>Build your journal spreadsheet</h1>
<p class="lede">A Google Sheets journal that calculates everything automatically. Row 1 is headers, trades start on row 2.</p>
${T(["Col","Header","Formula or entry"],[
["A","Date","type it"],["B","Instrument","MNQ, EURUSD, AAPL"],["C","Entry time (MT)","8:15"],
["D","Grade","A+, B, or C (skipped)"],["E","Confluence score","0 to 10"],
["F","Entry","price"],["G","Stop","price"],["H","Target","price"],["I","Exit","price"],
["J","Size","contracts, lots, or shares"],
["K","Planned RR","=(H2-F2)/(F2-G2)"],
["L","Actual R","=(I2-F2)/(F2-G2)"],
["M","Result","=IF(L2>0.05,&quot;Win&quot;,IF(L2<-0.05,&quot;Loss&quot;,&quot;BE&quot;))"],
["N","Dollar risk","type it"],
["O","P&amp;L $","=L2*N2"],
["P","RSI at tag","number"],["Q","Zone touches","number"],["R","Sweep?","Yes / No"],
["S","Followed plan?","Yes / No"],
["T","Equity (R)","=SUM($L$2:L2)"],
["U","Peak (R)","=MAX($T$2:T2)"],
["V","Drawdown (R)","=T2-U2"],
["W","Notes / screenshot link","text"],["X","Mistake type","None, Analysis, Execution, Discipline, Rule gap (see Tracking mistakes)"],["Y","Mistake cost (R)","R you got minus R following rules exactly"]],[0,2])}
<h2>Summary block (put in a second tab)</h2>
${T(["Stat","Formula"],[
["Trades","=COUNTA(Journal!L2:L)"],
["Win rate","=COUNTIF(Journal!M2:M,&quot;Win&quot;)/COUNTA(Journal!M2:M)"],
["Expectancy (R)","=AVERAGE(Journal!L2:L)"],
["Average planned RR","=AVERAGE(Journal!K2:K)"],
["Average win (R)","=AVERAGEIF(Journal!L2:L,&quot;>0.05&quot;)"],
["Profit factor","=SUMIF(Journal!L2:L,&quot;>0&quot;)/ABS(SUMIF(Journal!L2:L,&quot;<0&quot;))"],
["Max drawdown (R)","=MIN(Journal!V2:V)"],
["Plan adherence","=COUNTIF(Journal!S2:S,&quot;Yes&quot;)/COUNTA(Journal!S2:S)"]],[1])}
<p>Name the first tab <code>Journal</code> so the summary formulas work. Log skipped C setups in a separate tab with the same columns so they do not distort your real stats.</p>
${B("good","Or skip the setup","<p>The Trade log tab in this app calculates all of these stats automatically, draws your equity curve, tracks your Stage 1 gates, and exports a CSV with these same columns if you want it in Sheets later.</p>")}`},

{id:"b5",t:"Forward testing and moving to sim",h:`
<h1>Forward testing and moving to sim</h1>
<p class="lede">A backtest proves the idea. Forward testing proves you can execute it in real time.</p>
<h2>Stage 1 to Stage 2 checklist</h2>
<ul class="checklist">
<li><input type="checkbox" id="g1"><label for="g1">100+ logged backtest trades with frozen rules</label></li>
<li><input type="checkbox" id="g2"><label for="g2">Expectancy +0.3R or better</label></li>
<li><input type="checkbox" id="g3"><label for="g3">Average actual win 2.0R+</label></li>
<li><input type="checkbox" id="g4"><label for="g4">Plan adherence 95%+ over the last 50 trades</label></li>
<li><input type="checkbox" id="g5"><label for="g5">Max drawdown under 8R</label></li>
</ul>
<h2>What changes in live sim</h2>
<ul>
<li>You cannot pause. Decisions happen in real time</li>
<li>Slippage and real fills appear</li>
<li>Days with no setups feel much longer</li>
<li>Expect results a bit worse than backtest at first. A drop of 20 to 30% in expectancy is normal. A flip to negative means an execution problem to fix</li>
</ul>`},

{id:"b6",t:"When to change the strategy",h:`
<h1>When to change the strategy</h1>
<p class="lede">Most traders change too often. A few never change when they should.</p>
${T(["Situation","Action"],[
["Losing streak within the normal range","Change nothing"],
["Fewer than 50 trades of data","Change nothing"],
["Plan adherence under 90%","Fix discipline first. The strategy has not really been tested"],
["100+ trades, expectancy negative with good adherence","Review each rule with data. Consider a structured test of one variation"],
["Performance drops for 3+ months after being profitable","Market conditions may have shifted. Compare recent trades to older ones by filter"],
["A filter clearly helps across 20+ trades each side","Adopt it and freeze again"]])}
${B("warn","Never change during an evaluation","<p>Evaluations are for executing a proven plan, not experimenting.</p>")}`},

{id:"b7",t:"Tracking mistakes and their cost",h:`
<h1>Tracking mistakes and their cost</h1>
<p class="lede">Most traders know their win rate. Almost none know how much their mistakes cost them. That number is often the biggest improvement available.</p>
<h2>Four types of mistakes</h2>
${T(["Type","Examples"],[
["Analysis","Wrong zone, missed a news event, misread the EMA filter"],
["Execution","Wrong size, forgot the bracket, wrong contract month, chased the entry"],
["Discipline","Closed a winner early, moved a stop, revenge trade, third trade of the day"],
["Rule gap","A situation your rules do not cover yet"]])}
<h2>Add two columns to your journal</h2>
${T(["Column","What to enter"],[
["Mistake type","None, Analysis, Execution, Discipline, or Rule gap"],
["Mistake cost (R)","The R you got minus the R you would have gotten following the rules exactly"]])}
${P("Example: planned target 2.4R. You closed early at +0.8R.\nPrice later hit the target.\nMistake cost = 0.8 - 2.4 = -1.6R\n\nExample: you moved your stop, lost -1.8R instead of -1R.\nMistake cost = -1.8 - (-1.0) = -0.8R")}
<h2>What to do with it</h2>
<ul>
<li>Each month, total the mistake cost. Add it back to your actual results to see your <strong>rules-only expectancy</strong></li>
<li>Find your most expensive mistake type. Make that next month's one focus</li>
<li>If most mistakes are Discipline, the fix is a system (Module 10), not a new strategy</li>
</ul>
${B("good","Why this fits you","<p>If your 1.80 RR comes from early exits, this column will show it in black and white, with an exact R number attached. Seeing that number each month is one of the strongest motivators to leave brackets alone.</p>")}`},

{id:"b8",t:"Practice drills",h:`
<h1>Practice drills</h1>
<p class="lede">Backtesting full days builds overall skill. Short drills build specific skills much faster. Do one or two drills per week.</p>
${T(["Drill","How","Goal"],[
["Zone drill (15 min)","Open 10 random 1H charts. Draw and score zones. Then scroll forward to see which held","Your top-scored zones hold more often than your low-scored ones"],
["Candle call drill (15 min)","In replay, stop at every zone touch. Call qualify or not before revealing the next candle","90%+ agreement with the Module 3 checklist"],
["Sizing drill (10 min)","Make up 20 entry and stop pairs. Size each in your head, then check with the calculator","Every answer correct in under 30 seconds"],
["Speed prep drill (20 min)","Full pre-market routine on a random past day with a timer","Under 20 minutes, nothing missed"],
["Blind grading drill (20 min)","Take 20 old trade screenshots, hide the result, grade A+, B, or C","Your grades match what the results later showed"],
["Hands-off drill","Enter a replay trade, set the bracket, then look away for 30 real minutes","Builds the patience that fixes early exits"]])}
${B("note","Track drill scores","<p>Keep a Drills tab in your journal with the date and score. Watching the numbers improve is a good reminder that this is a trainable skill.</p>")}`},


{id:"bq",t:"Check yourself: Backtesting",q:[
{q:"Roughly how wide is the uncertainty on a win rate from 23 trades?",o:["+/- 2 points","+/- 5 points","+/- 20 points","It is exact"],a:2,e:"Small samples are extremely noisy."},
{q:"Your profit factor is total R won divided by:",o:["Number of trades","Total R lost","Win rate","Average win"],a:1,e:"Above 1.0 means profitable, 1.5+ is healthy."},
{q:"Backtest expectancy was +0.4R. In live sim it is +0.3R. This is:",o:["A disaster","A normal execution drop","Proof of cheating","Impossible"],a:1,e:"Some drop from backtest to live is expected."}
]}
]});

MODULES.push({title:"Prop firms and full-time",lessons:[
{id:"p1",t:"How prop firms work",h:`
<h1>How prop firms work</h1>
<p class="lede">Understanding the business model helps you use it well.</p>
<ol>
<li>You pay a monthly fee to take an evaluation in a <strong>simulated</strong> account</li>
<li>You hit a profit target without breaking the loss rule</li>
<li>You move to a funded account (at Topstep, the Express Funded Account, which is also simulated) and can request payouts from profits</li>
<li>Strong performers may move to a live funded account</li>
</ol>
<p>A large part of prop firm revenue comes from evaluation fees, which means most attempts fail. That is not a scam, but it means each fee is tuition. Only pay when your data says you are ready.</p>
${B("note","Why this is still a good deal for you","<p>Your maximum loss is the fee. You never risk your own trading capital. Compared with saving up $25,000+ for a personal account, that is a much safer path for a student.</p>")}`},

{id:"p2",t:"Topstep Trading Combine rules (2026)",h:`
<h1>Topstep Trading Combine rules (2026)</h1>
<p class="lede">Current as of September 2026 based on Topstep's help center and recent reviews. Topstep changed rules several times in 2025 and 2026, so confirm at help.topstep.com before buying.</p>
${T(["","50K","100K","150K"],[
["Profit target","$3,000","$6,000","$9,000"],
["Maximum Loss Limit (trailing)","$2,000","$3,000","$4,500"],
["Max position","5 minis / 50 micros","10 / 100","15 / 150"],
["Minimum trading days","None","None","None"],
["Time limit","None while subscribed","None","None"]],[1,2,3])}
<h2>The rules that matter most</h2>
<ul>
<li><strong>Maximum Loss Limit (MLL):</strong> the only hard rule. It trails up from your end-of-day balance and never moves down. It is enforced in real time, including open losses. Touch it and the account closes.</li>
<li><strong>Consistency target:</strong> your best single day must stay at or below roughly half of the profit target. On the 50K that means keep any day under about $1,500. Going over does not fail you, it raises the target. Check the help center for the exact percentage.</li>
<li><strong>Daily Loss Limit:</strong> optional add-on. If chosen and hit, it flattens you and pauses trading for the day without failing the account.</li>
<li><strong>Session times:</strong> Topstep's trading day resets at 5:00 PM CT (4:00 PM MT). Have positions closed before the late-afternoon cutoff (about 3:10 PM CT, 2:10 PM MT). Your 1:30 PM MT entry cutoff keeps you well clear.</li>
</ul>
<h2>Cost</h2>
<p>The 50K runs about $49 a month on the standard path plus an activation fee after passing, or a higher monthly price with no activation fee. Prices change often, so check the pricing page.</p>
${B("good","Why the 50K is the right first account","<p>Its $2,000 limit is 4% of the account, compared with 3% on the larger sizes. Most experienced prop traders start small and add more 50K accounts later instead of buying a big one.</p>")}`},

{id:"p3",t:"Planning your evaluation",h:`
<h1>Planning your evaluation</h1>
<p class="lede">Do the math before you pay, so you know how long it should take and how much room you have.</p>
${P("Account 50K   Target $3,000   MLL $2,000\nRisk per trade $200   (MLL / 10)\n\nAssume after filtering: 45% wins at 2.2R average\nExpectancy = 0.45 x 2.2 - 0.55 = +0.44R  = +$88 per trade\nTrades needed = $3,000 / $88 = about 34 trades\nAt 6 to 9 trades per week -> about 4 to 6 weeks\n\nConsistency: best day must stay under ~$1,500\nMax possible day at 2 trades x 2.2R x $200 = $880  (safe)")}
<h2>Your eval rulebook</h2>
<ul>
<li>$200 risk per trade until you are up $1,000, then you may use $250</li>
<li>A+ only mode (score 8+), 1 trade per day for the first week</li>
<li>Daily profit stop: done for the day after +$600</li>
<li>Track the MLL level in your plan every morning</li>
<li>Budget for 2 or 3 attempts in total</li>
</ul>`},

{id:"p4",t:"Passing, tactically",h:`
<h1>Passing, tactically</h1>
<p class="lede">The evaluation is not about making money fast. It is about not breaking the loss limit while making a modest amount.</p>
${T(["Do","Do not"],[
["Trade exactly your backtested strategy","Try new ideas"],
["Keep risk at MLL / 10 or less","Size up after a big day"],
["Stop after a good day","Keep trading because you are hot"],
["Protect the trailing high: after a big day, A+ only next session","Give back gains, which drags the MLL closer"],
["Write your MLL level on your daily plan","Guess how much room you have"],
["Accept a slow start","Force trades to hit the target sooner"]])}
${B("warn","Wait until you are ready","<p>Gate for paying: 100+ backtest trades with positive expectancy and 30 profitable days on Tradovate sim with no daily-limit breaches. Buying an evaluation to motivate yourself just costs money.</p>")}`},

{id:"p4b",t:"If you fail an evaluation",h:`
<h1>If you fail an evaluation</h1>
<p class="lede">Most people fail at least once. What you do next decides whether the second attempt goes better.</p>
<h2>The first 48 hours</h2>
<ul>
<li>Do not buy a reset or a new evaluation the same day. Decisions made right after a loss are usually bad ones</li>
<li>Write down what happened while it is fresh</li>
<li>Take at least one full day away from charts</li>
</ul>
<h2>Diagnose why</h2>
${T(["Cause","How you can tell","Next step"],[
["Rule break","Moved stops, oversized, revenge traded, extra trades","Fix with a system first (Module 10). Go back to sim for 2 weeks with zero rule breaks before retrying"],
["Variance","Followed every rule, just hit a normal losing streak","Retry with the same plan. Consider lowering risk to $150 per trade for more room"],
["Strategy not ready","Expectancy in the eval was far below your backtest","Return to Stage 1 or 2 and rebuild the sample"],
["Consistency or limit confusion","Did not track the MLL or best-day rule","Re-read the rules on help.topstep.com and write the numbers in your daily plan"]])}
<h2>Set an evaluation budget</h2>
<p>Decide in advance how much you will spend on evaluations per quarter, for example three attempts. If you hit the budget, go back to sim until the next quarter. This stops evaluation fees from quietly becoming your biggest expense.</p>
${B("warn","Resets","<p>Topstep offers paid resets. They can be useful, but only after you have diagnosed the failure. Buying a reset to get back in immediately is the evaluation version of revenge trading.</p>")}`},


{id:"p5",t:"Funded accounts and payouts",h:`
<h1>Funded accounts and payouts</h1>
<p class="lede">Passing changes the psychology more than the mechanics.</p>
<ul>
<li><strong>Trade exactly as in the evaluation.</strong> The urge to finally size up is the most common way new funded accounts die</li>
<li><strong>Take payouts as soon as you qualify.</strong> Money in your bank cannot be lost to a drawdown</li>
<li><strong>Know the payout rules.</strong> Topstep has separate Standard and Consistency paths for funded accounts, with different payout requirements, and changed them in 2026. Read the current version on the help center</li>
<li><strong>After your first payout</strong>, Topstep resets your loss floor, so the remaining balance becomes your cushion. Know exactly how much room you have after every withdrawal</li>
<li><strong>Inactive accounts can be closed</strong> after about 30 days with no trading</li>
</ul>
${B("note","Expect the first two weeks to feel harder","<p>Real payouts make losses feel heavier. Use A+ only mode for your first two weeks funded.</p>")}`},

{id:"p6",t:"Scaling with multiple accounts",h:`
<h1>Scaling with multiple accounts</h1>
<p class="lede">Your time per day stays about the same whether you run one account or five. That gap is why scaling works.</p>
<h2>Lead and follower</h2>
<p>You trade one account by hand. A trade copier mirrors every order to your other accounts. TopstepX has multi-account features, and third-party copiers exist for other platforms. Check that your firm allows copying between your own accounts before setting it up.</p>
<h2>Pace</h2>
<ul>
<li>Get one funded account through 60 days and 2+ payouts first</li>
<li>Add one account every 30 to 60 days</li>
<li>Check the firm's maximum number of funded accounts per person</li>
</ul>
${P("5 accounts, each averaging +$1,000 net per month after rules and splits\n= about $5,000 per month from the same trades\n\nA bad day also hits all 5 accounts at once.")}
${B("warn","Scaling multiplies mistakes","<p>One revenge-trading session can breach every account at the same time. Your discipline has to be at its best before you scale, not after.</p>")}`},

{id:"p7",t:"Taxes and business basics",h:`
<h1>Taxes and business basics</h1>
<p class="lede">Not tax advice, just the basics so nothing surprises you. Talk to a tax professional once payouts start.</p>
<ul>
<li>Prop firm payouts are usually paid to you as an independent contractor, often reported on a 1099. That generally means <strong>self-employment income</strong></li>
<li>Self-employment income usually carries self-employment tax on top of regular income tax. Set aside <strong>25 to 30%</strong> of every payout</li>
<li>You may need to pay <strong>quarterly estimated taxes</strong></li>
<li>Evaluation fees, data subscriptions and software may be deductible business expenses. Keep every receipt</li>
<li>The special 60/40 tax treatment for futures generally applies to trading your own account, and may not apply to prop payouts. Ask a professional</li>
</ul>
${B("good","Your accounting classes help here","<p>Keep a simple income and expense ledger from your first payout. You already know how.</p>")}`},

{id:"p8",t:"Going full-time",h:`
<h1>Going full-time</h1>
<p class="lede">Check these honestly. All of them before trading replaces other income.</p>
<ul class="checklist">
<li><input type="checkbox" id="ft1"><label for="ft1">12 consecutive months of payouts</label></li>
<li><input type="checkbox" id="ft2"><label for="ft2">12 months of living expenses saved, separate from trading</label></li>
<li><input type="checkbox" id="ft3"><label for="ft3">Average monthly payout at least 1.5x monthly expenses</label></li>
<li><input type="checkbox" id="ft4"><label for="ft4">Survived a losing month without breaking rules</label></li>
<li><input type="checkbox" id="ft5"><label for="ft5">Multiple funded accounts, so one loss does not end income</label></li>
<li><input type="checkbox" id="ft6"><label for="ft6">Health insurance sorted</label></li>
<li><input type="checkbox" id="ft7"><label for="ft7">Taxes set aside and a tax professional lined up</label></li>
<li><input type="checkbox" id="ft8"><label for="ft8">Degree finished or a clear plan to finish it</label></li>
</ul>`},

{id:"p9",t:"The honest section",h:`
<h1>The honest section</h1>
<p class="lede">You said you understand there is no guarantee. Here is exactly what the odds look like, so you can beat them on purpose.</p>
<p>Most retail day traders lose money over time. Studies commonly put the share in the 70 to 90% range depending on market and time period. Most prop firm evaluation attempts fail, and some traders who pass later lose the funded account.</p>
<h2>What separates the minority who make it</h2>
${T(["Most traders","Traders who last"],[
["Risk random amounts","Fixed small risk every trade"],
["Change strategies constantly","Hundreds of trades on one strategy"],
["No journal","Detailed journal and regular reviews"],
["Trade every day, all day","Trade only their best window and best setups"],
["Trade news","Stay out of news"],
["Pay for evaluations early","Wait until their data says ready"],
["Need it to work fast","Treat it as a multi-year skill"]])}
<p>Everything in this manual pushes you into the right-hand column. That does not guarantee profit, but it is the best way to improve your odds.</p>
<ul>
<li>Never use money you cannot afford to lose, including evaluation fees</li>
<li>Keep school moving. A degree has no drawdown limit</li>
<li>If you catch yourself borrowing money for evaluations, hiding losses, or chasing a bad month, step back entirely</li>
</ul>
${B("good","You are already ahead","<p>You picked one strategy and stuck with it, fixed your position sizing early, and you are measuring your results. Most people never do any of those. Keep doing the slow, boring version.</p>")}`},

{id:"pq",t:"Check yourself: Prop firms",q:[
{q:"Topstep 50K Maximum Loss Limit?",o:["$1,000","$2,000","$3,000","$5,000"],a:1,e:"$2,000, trailing from end-of-day balance."},
{q:"Your best day on a 50K Combine is $1,800. What happens?",o:["You fail","Your required profit target rises","Nothing","You get paid"],a:1,e:"The consistency target raises the needed profit, it does not fail you."},
{q:"How much of each payout should you set aside for taxes?",o:["0%","5%","25 to 30%","100%"],a:2,e:"Self-employment income carries extra tax."},
{q:"When should you add a second funded account?",o:["Right after passing","After 60 days and 2+ payouts on the first","Before passing","Never"],a:1,e:"Prove one account first."},
{q:"You just failed an evaluation following every rule. Best next step?",o:["Buy a reset right away","Take a day off, confirm it was variance, retry with the same plan","Switch strategies","Double your risk next time"],a:1,e:"If rules were followed, it was likely variance. Retry calmly, possibly with lower risk."}
]}
]});

{id:"x1",t:"Quick reference card",h:`
<h1>Quick reference card</h1>
<p class="lede">Print this. Tape it next to your monitor.</p>
${P("SETUP (all four)\n  1H price above rising 20 EMA\n  Pullback into pre-marked 1H zone (2+ touches)\n  5M RSI(14) dips below 40 in zone\n  5M bullish reversal candle CLOSES at/above zone mid\n  + first obstacle 2R+ away, confluence 6+\n\nEXECUTE\n  Entry  market at close   (skip if >0.3R chase)\n  Stop   min(zone low, candle low) - 0.4 x 5M ATR\n  Target a few ticks before first obstacle\n  Size   risk$ / (stop pts x $/pt)  round down\n\nLIMITS\n  0.5% risk (Topstep 50K: $150-200)\n  2 trades/day, stop after 2 losses\n  No trades 30 min before / 15 after red news\n  No entries after 1:30 PM MT\n  Never move a stop away, never add to a loser\n\nTIMES (MT)\n  7:00  news, levels, zones, plan\n  7:30  open, watch only\n  7:45-9:00  primary window\n  9:00-12:00 weak, A+ only\n  12:00-1:30 secondary window\n  2:00  cash close, journal\n\nMNQ $2/pt   MES $5/pt   EUR/USD $10/pip/lot")}`},

{id:"x2",t:"Glossary",h:`
<h1>Glossary</h1>
<p class="lede">Every term used in this manual, in one place.</p>
${T(["Term","Meaning"],[
["A+ setup","Confluence score 8 to 10"],["ATR","Average True Range, typical candle size"],["Ask","Lowest price a seller will accept"],
["Bid","Highest price a buyer will pay"],["Bracket order","Entry with stop and target attached"],["Break of structure","Trend fails to make a new higher low (uptrend) or lower high (downtrend)"],
["Chop","Directionless, overlapping price action"],["Confluence","Multiple independent reasons agreeing"],["Consistency target","Topstep rule limiting how much of the profit target one day can supply"],
["Continuous contract","Chart symbol like MNQ1! that stitches contract months together"],["Divergence","Price and RSI moving in opposite directions"],["Drawdown","Drop from a peak balance"],
["EMA","Exponential moving average"],["ETH / RTH","Extended / regular trading hours"],["Expectancy","Average result per trade, best measured in R"],
["Flip","Broken support becoming resistance, or the reverse"],["FOMC","Federal Reserve rate-setting committee"],["Front month","The contract month with the most volume"],
["Liquidity","Ease of trading without moving price"],["Long","Buy position"],["MLL","Maximum Loss Limit, Topstep's trailing drawdown"],
["MNQ / MES","Micro Nasdaq / micro S&amp;P futures"],["NFP","Non-Farm Payrolls jobs report"],["ONH / ONL","Overnight high / low"],
["PDH / PDL / PDC","Previous day high / low / close"],["Pip","0.0001 on EUR/USD"],["Profit factor","Total won divided by total lost"],
["R","One unit of risk"],["Rollover","Moving from an expiring contract to the next"],["RSI","Relative Strength Index, momentum from 0 to 100"],
["Short","Sell position"],["Slippage","Fill worse than expected"],["Spread","Gap between bid and ask"],
["Stop run / sweep","Price dipping past a level to trigger stops before reversing"],["Swing high / low","Local peak / trough"],["Tick","Minimum price change (0.25 on MNQ)"],

const PH=[[0,385,'Early morning','Futures are trading overnight. Your prep starts at 7:00 AM.','gray'],[385,405,'News window','US data releases hit at 6:30 AM. Hands off until 6:45.','amber'],[405,420,'Get ready','Coffee, no social media. Prep starts at 7:00.','gray'],[420,450,'Pre-market prep','Check Forex Factory, mark levels, draw zones, write your plan.','blue'],[450,465,'Opening bell','Watch only. The first 15 minutes are full of fake moves.','amber'],[465,540,'Primary window','Your best setups happen now. Execute only what is in your plan.','go'],[540,720,'Midday lull','Volume drops and setups stall. A+ only, or step away.','gray'],[720,810,'Secondary window','Volume returns. Same rules as the morning.','go'],[810,840,'No new entries','Manage open trades only. Cash market closes at 2:00 PM.','amber'],[840,900,'Review','Cash session is closed. Screenshot and journal your trades.','blue'],[900,960,'Futures break','CME daily maintenance break until 4:00 PM.','gray'],[960,1440,'Evening','Good time for an FX Replay backtesting session.','gray']];

  const p=mtParts(),m=p.h*60+p.mi,mf=m+p.s/60,wd=p.wd;const t12=((p.h+11)%12+1)+':'+String(p.mi).padStart(2,'0')+' '+(p.h<12?'AM':'PM');
  let phase,tip,col,next='';
  const weekend=wd==='Sat'||(wd==='Sun'&&m<960)||(wd==='Fri'&&m>=900);

  else{const cur=PH.find(x=>m>=x[0]&&m<x[1])||PH[PH.length-1];phase=cur[2];tip=cur[3];col=cur[4];const ni=PH.indexOf(cur)+1;

const TD=t=>{const risk=Math.abs(t.entry-t.stop),dir=t.dir==='Short'?-1:1;const r=risk>0?dir*(t.exit-t.entry)/risk:0,pl=risk>0?Math.abs(t.target-t.entry)/risk:0;return Object.assign({},t,{_r:r,_p:pl});};
function stats(tr){
  const ts=tr.map(TD).sort((a,b)=>(a.date>b.date?1:a.date<b.date?-1:a.id-b.id));const n=ts.length;
  if(!n)return {n:0,exp:0,wr:0,avgWin:0,adh:0,ts:[]};
  const rs=ts.map(t=>t._r),w=rs.filter(r=>r>0.05),l=rs.filter(r=>r<-0.05),sum=a=>a.reduce((x,y)=>x+y,0);
  let eq=0,pk=0,dd=0,ls=0,cl=0;const curve=[0];rs.forEach(r=>{eq+=r;curve.push(eq);pk=Math.max(pk,eq);dd=Math.min(dd,eq-pk);if(r<-0.05){cl++;ls=Math.max(ls,cl);}else if(r>0.05)cl=0;});
  return {n,ts,curve,wr:w.length/n,exp:sum(rs)/n,avgWin:w.length?sum(w)/w.length:0,avgLoss:l.length?sum(l)/l.length:0,pf:l.length?sum(w)/Math.abs(sum(l)):(w.length?Infinity:0),planned:sum(ts.map(t=>t._p))/n,dd,ls,adh:ts.filter(t=>t.plan).length/n,mcost:sum(ts.map(t=>+t.mcost||0)),usd:sum(ts.map(t=>t._r*(+t.risk||0))),totalR:eq};
}

  journal.trades.push({id:Date.now(),date:g('tDate')||dkey(mtParts()),inst:g('tInst'),dir:g('tDir'),score:g('tScore'),entry:+g('tEntry'),stop:+g('tStop'),target:g('tTarget')===''?+g('tExit'):+g('tTarget'),exit:+g('tExit'),risk:+g('tRisk')||0,plan:$('tPlan').checked,mtype:g('tMist'),mcost:g('tMcost')===''?0:+g('tMcost'),notes:g('tNotes')});
  saveJ();touchDay();closeSheet();toast('Trade logged');if(route().v==='log'||route().v==='today')render(true);else chrome(route().v);}
function csv(){const st=stats(journal.trades);const h=['Date','Instrument','Direction','Score','Entry','Stop','Target','Exit','Risk $','Planned RR','Actual R','Result','P&L $','Followed plan','Mistake type','Mistake cost R','Notes'];
  const q=v=>{v=String(v==null?'':v);return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v;};
  const rows=st.ts.map(t=>[t.date,t.inst,t.dir,t.score,t.entry,t.stop,t.target,t.exit,t.risk,t._p.toFixed(2),t._r.toFixed(2),t._r>0.05?'Win':t._r<-0.05?'Loss':'BE',(t._r*t.risk).toFixed(2),t.plan?'Yes':'No',t.mtype,t.mcost,t.notes].map(q).join(','));
  return h.join(',')+'\n'+rows.join('\n');}

function score(){let s=0;document.querySelectorAll('.sc').forEach(c=>{if(c.checked)s+=+c.dataset.p;});$('scOut').textContent=s+' / 10';const g=s>=8?['A+','Take it']:s>=6?['B','Take it']:['C','Skip'];$('scGrade').textContent=g[0];$('scAct').textContent=g[1];$('scGrade').style.color=s>=6?'var(--go)':'var(--stop)';}
function calcPos(){const inst=$('cInst').value,acct=+$('cAcct').value,rp=+$('cRisk').value,e=+$('cEntry').value,s=+$('cStop').value,t=+$('cTgt').value;
    const budget=acct*rp/100;$('oRisk').textContent=money(budget);const msg=$('oMsg');const d=e-s;
    if(!(d>0)){['oSize','oAct','oRR','oRew'].forEach(x=>$(x).textContent='-');msg.style.color='var(--stop)';msg.textContent='For a long, the stop must be below the entry.';return;}
    const mult={MNQ:2,MES:5,NQ:20,ES:50}[inst];let per,size,unit;
    if(mult){per=d*mult;size=Math.floor(budget/per);unit=size===1?' contract':' contracts';}else if(inst==='EURUSD'){per=d*10000*10;size=Math.floor(budget/per*100)/100;unit=' lots';}else{per=d;size=Math.floor(budget/per);unit=' shares';}
    const act=size*per,rr=(t-e)/d;$('oSize').textContent=size+unit;$('oAct').textContent=money(act);$('oRR').textContent=(t>e?rr.toFixed(2):'-')+'R';$('oRew').textContent=t>e?money(act*rr):'-';
    if(size<=0){msg.style.color='var(--stop)';msg.textContent='Stop is too wide for this risk budget. Skip the trade, or use a micro contract.';}
    else if(!(t>e)){msg.style.color='var(--stop)';msg.textContent='Target must be above entry for a long.';}
    else if(rr<2){msg.style.color='var(--stop)';msg.textContent='Under 2R. By your rules, no trade.';}
    else{msg.style.color='var(--go)';msg.textContent='Passes the 2R rule. Enter with a bracket order.';}}
function presetPos(){const pre={MNQ:[30218,30182,30312],MES:[6620,6612,6640],NQ:[30218,30182,30312],ES:[6620,6612,6640],EURUSD:[1.085,1.0832,1.0892],STOCK:[210,209.3,211.8]}[$('cInst').value];if(!pre)return;$('cEntry').value=pre[0];$('cStop').value=pre[1];$('cTgt').value=pre[2];calcPos();}
function calcExp(){const p=(+$('eWin').value)/100,rr=+$('eRR').value,n=+$('eN').value,R=+$('eR').value;if(!(p>0&&p<1&&rr>0&&n>1))return;const ex=p*rr-(1-p);
  $('eExp').textContent=fr(ex);$('eTot').textContent=money(ex*n*R);const st=Math.log(n)/Math.log(1/(1-p));$('eStr').textContent='about '+Math.round(st);$('eDD').textContent=money(-Math.round(st)*R);$('eBE').textContent=(100/(1+rr)).toFixed(1)+'%';}

    FLAT.forEach((l,i)=>{const T=l.t.toLowerCase(),X=TEXT[i].toLowerCase();if(!words.every(w=>X.includes(w)||T.includes(w)))return;let sc=words.reduce((a,w)=>a+(T.includes(w)?20:0)+(X.split(w).length-1),0);

  if(from&&!RM()&&(from.l!==to.l||from.w!==to.w)){ind.style.transition='none';ind.style.left=from.l+'px';ind.style.width=from.w+'px';void ind.offsetWidth;ind.style.transition='';}
  ind.style.left=to.l+'px';ind.style.width=to.w+'px';SEGPOS[k]=to;});}
function countUp(el){const txt=el.textContent,m=txt.match(/-?[\d,]*\.?\d+/);if(!m)return;const raw=m[0],val=parseFloat(raw.replace(/,/g,'')),dec=(raw.split('.')[1]||'').length,comma=raw.includes(',');if(!isFinite(val)||val===0)return;
  const pre=txt.slice(0,m.index),post=txt.slice(m.index+raw.length),t0=performance.now(),D=750;
  const fmt=v=>{let s=Math.abs(v).toFixed(dec);if(comma)s=Number(s).toLocaleString(undefined,{minimumFractionDigits:dec,maximumFractionDigits:dec});return (v<0?'-':'')+s;};
  const step=now=>{const k=Math.min(1,(now-t0)/D),e=1-Math.pow(1-k,3);el.textContent=pre+fmt(val*e)+post;if(k<1)requestAnimationFrame(step);else el.textContent=txt;};requestAnimationFrame(step);}
function motion(fresh){segs();if(!fresh||RM())return;
  requestAnimationFrame(()=>requestAnimationFrame(()=>{
    document.querySelectorAll('#view [data-to]').forEach(c=>{c.style.strokeDashoffset=c.dataset.to;c.removeAttribute('data-to');});
    document.querySelectorAll('#view [data-w]').forEach(b=>{b.style.width=b.dataset.w+'%';b.removeAttribute('data-w');});
  }));
  document.querySelectorAll('#view .stat-v, #view .big-n, #view .calc-out b').forEach(countUp);}
function pop(el,cls){if(!el||RM())return;el.classList.remove(cls);void el.offsetWidth;el.classList.add(cls);el.addEventListener('animationend',()=>el.classList.remove(cls),{once:true});}
let drag=null,dragEnded=false;
function cardT(fc,dx){return 'translateX('+dx+'px) rotate('+(dx/22).toFixed(2)+'deg)'+(fc.classList.contains('flip')?' rotateY(180deg)':'');}
document.addEventListener('pointerdown',e=>{const fc=e.target.closest&&e.target.closest('#fc');if(!fc||(e.button&&e.button>0))return;drag={x:e.clientX,y:e.clientY,dx:0,moved:false,fc,id:e.pointerId};});
document.addEventListener('pointermove',e=>{if(!drag||e.pointerId!==drag.id)return;const dx=e.clientX-drag.x,dy=e.clientY-drag.y;
  if(!drag.moved){if(Math.abs(dx)>8&&Math.abs(dx)>Math.abs(dy)*1.2){drag.moved=true;drag.fc.classList.add('dragging');}else return;}
  drag.dx=dx;drag.fc.style.transform=cardT(drag.fc,dx);const h=$('fcHint');if(h){h.dataset.side=dx>0?'r':'l';h.style.opacity=Math.min(1,Math.abs(dx)/90);}});
function endDrag(e,cancel){if(!drag||(e&&e.pointerId!==drag.id))return;const d=drag;drag=null;if(!d.moved)return;dragEnded=true;setTimeout(()=>{dragEnded=false;},350);d.fc.classList.remove('dragging');const h=$('fcHint');if(h)h.style.opacity=0;
  if(!cancel&&Math.abs(d.dx)>90)advanceCard(d.dx>0);else d.fc.style.transform='';}
let tStart=null;
document.addEventListener('touchstart',e=>{const fc=e.target.closest&&e.target.closest('#fc');tStart=fc&&e.touches.length===1?{x:e.touches[0].clientX,y:e.touches[0].clientY,t:Date.now()}:null;},{passive:true});
document.addEventListener('touchend',e=>{if(!tStart)return;const s=tStart;tStart=null;const c=e.changedTouches&&e.changedTouches[0];if(!c)return;if(Math.abs(c.clientX-s.x)<10&&Math.abs(c.clientY-s.y)<10&&Date.now()-s.t<600){flipCard();}},{passive:true});
document.addEventListener('pointerup',e=>endDrag(e,false));document.addEventListener('pointercancel',e=>endDrag(e,true));
function advanceCard(know){const c=deck[dI];if(know)state.fc[c[0]]=1;else delete state.fc[c[0]];save();touchDay();
  const fc=$('fc'),dir=know?1:-1;dI=(dI+1)%deck.length;
  if(!fc||RM()){render(true);return;}
  fc.classList.add('flying');fc.style.transform='translateX('+(dir*Math.max(window.innerWidth,700))+'px) rotate('+(dir*16)+'deg)'+(fc.classList.contains('flip')?' rotateY(180deg)':'');
  setTimeout(()=>{render(true);cardIn(know?'r':'l');},300);}
function cardIn(from){const fc=$('fc');if(!fc||RM())return;pop(fc,'in-'+from);}

/* ---------- boot ---------- */
(async()=>{
  applyTheme();render();
  try{await load();}catch(e){diag('load: '+e.message);norm();}
  applyTheme();
  if(USE_URL&&!location.hash&&state.last==null){}
  render(true);
})();
</script>
